<!doctype html>
<!-- Plantilla Maestra para Nuevos Centros de Documentación del Curso -->
<html lang="es">
<head>
    <!-- charset="UTF-8": codificación universal | viewport: escala responsiva en móviles -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- description: resumen de la página para buscadores y accesibilidad -->
    <meta name="description" content="Centro de apuntes y guías Markdown del nivel." />
    <title>📚 Apuntes Completos — Nivel | Curso Desarrollo Web</title>
    <!-- Preconexión a Google Fonts (crossorigin es obligatorio para fuentes externas) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <!-- Datos locales de los apuntes (window.DOCS_CONTENT) y diagramas Mermaid (defer: tras cargar HTML) -->
    <script src="docs-data.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js" defer></script>
    <!-- Selector cruzado, barra de lectura, ScrollSpy, Modo Enfoque, ↑ Subir y favicon oficial -->
    <script src="../../RESOURCES COURSE/plantilla/docs-switcher.js" defer></script>
    <style>
        /* Personaliza únicamente --primary según el color del nivel (ej. #38bdf8, #f59e0b, #10b981) */
        :root { --bg: #070a13; --card: rgba(16, 24, 42, 0.85); --border: rgba(255, 255, 255, 0.1); --primary: #38bdf8; --cyan: #10b981; --text: #f1f5f9; --muted: #94a3b8; --sans: 'Outfit', system-ui, sans-serif; --mono: 'Fira Code', monospace; }
        * { box-sizing: border-box; margin: 0; padding: 0; scrollbar-width: thin; scrollbar-color: var(--primary) #070a13; }
        body { background: var(--bg); color: var(--text); font-family: var(--sans); min-height: 100vh; display: flex; flex-direction: column; }
        .topbar { position: sticky; top: 0; z-index: 40; background: rgba(7, 10, 19, 0.92); backdrop-filter: blur(14px); border-bottom: 1px solid var(--border); padding: 12px 24px; display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; }
        .brand { display: flex; align-items: center; gap: 12px; }
        .badge { font-family: var(--mono); font-size: 0.72rem; font-weight: 600; color: var(--primary); background: color-mix(in srgb, var(--primary) 14%, transparent); border: 1px solid color-mix(in srgb, var(--primary) 38%, transparent); padding: 4px 10px; border-radius: 999px; }
        .title { font-weight: 700; font-size: 1.05rem; }
        .btn { background: rgba(255, 255, 255, 0.06); color: var(--text); border: 1px solid var(--border); border-radius: 10px; padding: 7px 14px; font-family: var(--sans); font-size: 0.85rem; font-weight: 600; text-decoration: none; cursor: pointer; }
        .btn:hover { border-color: var(--primary); }
        .layout { max-width: 1420px; width: 100%; margin: 0 auto; display: grid; grid-template-columns: 270px 1fr 240px; gap: 20px; padding: 22px; flex: 1; }
        .sidebar, .toc { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 16px; height: fit-content; position: sticky; top: 80px; max-height: calc(100vh - 100px); overflow-y: auto; }
        .search-box { width: 100%; background: #060913; color: var(--text); border: 1px solid var(--border); border-radius: 10px; padding: 9px 12px; font-family: var(--sans); font-size: 0.88rem; margin-bottom: 12px; outline: none; }
        .search-box:focus { border-color: var(--primary); }
        .doc-list { display: flex; flex-direction: column; gap: 6px; }
        .doc-item { display: flex; flex-direction: column; gap: 2px; background: transparent; border: 1px solid transparent; border-radius: 10px; padding: 10px 12px; text-align: left; color: var(--text); font-family: var(--sans); cursor: pointer; }
        .doc-item:hover { background: rgba(255, 255, 255, 0.04); border-color: var(--border); }
        .doc-item.active { background: color-mix(in srgb, var(--primary) 14%, transparent); border-color: var(--primary); }
        .doc-item strong { font-size: 0.9rem; }
        .doc-item span { font-size: 0.74rem; color: var(--muted); font-family: var(--mono); }
        .toc-title { font-size: 0.78rem; font-family: var(--mono); color: var(--primary); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 10px; }
        .toc-list { display: flex; flex-direction: column; gap: 6px; }
        .toc-link { color: var(--muted); text-decoration: none; font-size: 0.82rem; line-height: 1.35; }
        .toc-link:hover { color: var(--primary); }
        .toc-link.lvl-3 { padding-left: 14px; font-size: 0.78rem; }
        .reader { background: var(--card); border: 1px solid var(--border); border-radius: 18px; padding: 28px 34px; min-width: 0; }
        .reader-head { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; padding-bottom: 16px; margin-bottom: 22px; border-bottom: 1px solid var(--border); }
        .reader-head h1 { font-size: 1.7rem; font-weight: 800; color: #fff; }
        .md-body { line-height: 1.74; color: #cbd5e1; font-size: 0.98rem; }
        .md-body h1, .md-body h2, .md-body h3 { color: #fff; margin: 1.4em 0 0.6em; line-height: 1.3; scroll-margin-top: 84px; }
        .md-body h2 { font-size: 1.38rem; color: var(--primary); border-bottom: 1px solid var(--border); padding-bottom: 6px; }
        .md-body p { margin-bottom: 0.95em; }
        .md-body ul, .md-body ol { padding-left: 22px; margin-bottom: 1em; }
        .md-body code { font-family: var(--mono); font-size: 0.84em; background: rgba(56, 189, 248, 0.12); color: var(--primary); padding: 2px 6px; border-radius: 5px; }
        .code-wrap { position: relative; margin: 14px 0; }
        .copy-btn { position: absolute; top: 8px; right: 8px; background: rgba(255, 255, 255, 0.08); color: #cbd5e1; border: 1px solid var(--border); border-radius: 6px; padding: 4px 10px; font-family: var(--mono); font-size: 0.72rem; cursor: pointer; }
        .copy-btn:hover { background: var(--primary); color: #070a13; }
        .md-body pre { background: #050811; border: 1px solid var(--border); border-radius: 12px; padding: 16px; overflow-x: auto; }
        .md-body pre code { background: none; color: #34d399; padding: 0; font-size: 0.85rem; }
        .md-body blockquote { border-left: 4px solid var(--primary); background: color-mix(in srgb, var(--primary) 10%, transparent); padding: 10px 16px; border-radius: 0 10px 10px 0; margin: 12px 0; }
        .md-body table { width: 100%; border-collapse: collapse; margin: 14px 0; font-size: 0.9rem; overflow-x: auto; display: block; }
        .md-body th, .md-body td { border: 1px solid var(--border); padding: 9px 12px; text-align: left; }
        .md-body th { background: color-mix(in srgb, var(--primary) 14%, transparent); color: var(--primary); font-weight: 700; }
        .md-body hr { border: none; border-top: 1px solid var(--border); margin: 20px 0; }
        .md-body .mermaid { background: #050811; border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin: 14px 0; overflow-x: auto; text-align: center; }
        @media (max-width: 1120px) { .layout { grid-template-columns: 260px 1fr; } .toc { display: none; } }
        @media (max-width: 820px) { .layout { grid-template-columns: 1fr; } .sidebar { position: static; max-height: none; } }
    </style>
</head>
<body>
    <header class="topbar">
        <div class="brand">
            <span class="badge">NIVEL · DOCUMENTACIÓN</span>
            <span class="title">📘 Apuntes Completos</span>
        </div>
        <div style="display:flex;gap:10px;flex-wrap:wrap;">
            <a class="btn" href="../../index.html?filter=proyectos">🚀 Proyectos</a>
            <a class="btn" href="../../index.html">🏠 Portal Principal</a>
        </div>
    </header>
    <div class="layout">
        <aside class="sidebar">
            <input type="search" id="docSearch" class="search-box" placeholder="Buscar en apuntes..." />
            <div class="doc-list" id="docList"></div>
        </aside>
        <main class="reader">
            <div class="reader-head">
                <h1 id="docTitle">Selecciona un apunte</h1>
                <a id="moduleBtn" class="btn" href="../Modulo01/index.html">🎯 Ir al Módulo</a>
            </div>
            <div id="docContent" class="md-body"></div>
        </main>
        <aside class="toc">
            <div class="toc-title">📑 Índice</div>
            <div class="toc-list" id="tocList"></div>
        </aside>
    </div>
    <script>
        "use strict";

        // 1. ÚNICO LUGAR A EDITAR: lista de archivos .md y sus módulos correspondientes
        const DOCS = [
            { file: "01_EJEMPLO.md", title: "01. Primer Tema", module: "../PrimerTema/index.html" }
        ];

        const docList = document.getElementById("docList");
        const docSearch = document.getElementById("docSearch");
        const docTitle = document.getElementById("docTitle");
        const docContent = document.getElementById("docContent");
        const tocList = document.getElementById("tocList");
        const moduleBtn = document.getElementById("moduleBtn");
        let activeFile = DOCS[0].file;

        const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        const fmt = (t) => esc(t).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>").replace(/\*([^*]+)\*/g, "<em>$1</em>");

        function renderMd(md) {
            const lines = md.replace(/\r\n/g, "\n").split("\n");
            let html = "", inCode = false, codeLang = "", listTag = "", inTable = false, hIdx = 0, toc = [];
            const closeList = () => { if (listTag) { html += `</${listTag}>`; listTag = ""; } };
            const closeTable = () => { if (inTable) { html += "</tbody></table>"; inTable = false; } };

            for (const line of lines) {
                if (line.trim().startsWith("```")) {
                    closeList(); closeTable();
                    if (!inCode) {
                        codeLang = line.trim().slice(3).trim().toLowerCase();
                        html += codeLang === "mermaid" ? '<div class="mermaid">' : '<div class="code-wrap"><button class="copy-btn">Copiar</button><pre><code>';
                        inCode = true;
                    } else {
                        html += codeLang === "mermaid" ? "</div>" : "</code></pre></div>";
                        inCode = false; codeLang = "";
                    }
                    continue;
                }
                if (inCode) { html += esc(line) + "\n"; continue; }
                const tr = line.trim();
                if (!tr) { closeList(); closeTable(); continue; }
                if (tr.startsWith("|") && tr.endsWith("|")) {
                    closeList();
                    const cells = tr.slice(1, -1).split("|").map(c => c.trim());
                    if (cells.every(c => /^:?-{2,}:?$/.test(c))) continue;
                    if (!inTable) { inTable = true; html += "<table><thead><tr>" + cells.map(c => `<th>${fmt(c)}</th>`).join("") + "</tr></thead><tbody>"; }
                    else html += "<tr>" + cells.map(c => `<td>${fmt(c)}</td>`).join("") + "</tr>";
                    continue;
                }
                closeTable();
                if (/^---+$/.test(tr)) { closeList(); html += "<hr>"; }
                else if (/^#{1,3}\s+/.test(tr)) {
                    closeList();
                    const lvl = tr.match(/^(#{1,3})/)[1].length;
                    const raw = tr.replace(/^#{1,3}\s+/, "");
                    const id = "s-" + (++hIdx);
                    if (lvl >= 1 && hIdx > 1) toc.push({ id, lvl, text: raw.replace(/`/g, "") });
                    html += `<h${lvl} id="${id}">${fmt(raw)}</h${lvl}>`;
                } else if (/^[-*]\s+/.test(tr)) {
                    if (listTag !== "ul") { closeList(); html += "<ul>"; listTag = "ul"; }
                    html += `<li>${fmt(tr.replace(/^[-*]\s+/, ""))}</li>`;
                } else if (/^\d+\.\s+/.test(tr)) {
                    if (listTag !== "ol") { closeList(); html += "<ol>"; listTag = "ol"; }
                    html += `<li>${fmt(tr.replace(/^\d+\.\s+/, ""))}</li>`;
                } else if (tr.startsWith(">")) {
                    closeList(); html += `<blockquote>${fmt(tr.replace(/^>\s*/, ""))}</blockquote>`;
                } else {
                    closeList(); html += `<p>${fmt(tr)}</p>`;
                }
            }
            closeList(); closeTable();
            if (inCode) html += codeLang === "mermaid" ? "</div>" : "</code></pre></div>";
            return { html, toc };
        }

        function loadDoc(doc) {
            activeFile = doc.file;
            docTitle.textContent = doc.title;
            if (moduleBtn && doc.module) moduleBtn.href = encodeURI(doc.module);
            renderSidebar(docSearch.value);
            const md = (window.DOCS_CONTENT && window.DOCS_CONTENT[doc.file]) || "";
            const { html, toc } = renderMd(md);
            docContent.innerHTML = html;
            if (window.mermaid && docContent.querySelector(".mermaid")) {
                try { window.mermaid.initialize({ startOnLoad: false, theme: "dark" }); window.mermaid.run({ nodes: docContent.querySelectorAll(".mermaid") }); } catch (_) {}
            }
            tocList.innerHTML = toc.map((t) => `<a class="toc-link lvl-${t.lvl}" href="#${t.id}">${esc(t.text)}</a>`).join("");
            docContent.querySelectorAll(".copy-btn").forEach((b) =>
                b.addEventListener("click", () => {
                    navigator.clipboard?.writeText(b.nextElementSibling?.textContent || "");
                    b.textContent = "¡Copiado!";
                    setTimeout(() => (b.textContent = "Copiar"), 1400);
                })
            );
        }

        function renderSidebar(q = "") {
            const term = q.trim().toLowerCase();
            docList.innerHTML = "";
            DOCS.filter(d => !term || d.title.toLowerCase().includes(term) || ((window.DOCS_CONTENT && window.DOCS_CONTENT[d.file]) || "").toLowerCase().includes(term))
                .forEach((doc) => {
                    const b = document.createElement("button");
                    b.className = "doc-item" + (doc.file === activeFile ? " active" : "");
                    b.innerHTML = `<strong>${doc.title}</strong><span>${doc.file}</span>`;
                    b.addEventListener("click", () => loadDoc(doc));
                    docList.appendChild(b);
                });
        }

        docSearch.addEventListener("input", () => renderSidebar(docSearch.value));
        loadDoc(DOCS[0]);
    </script>
</body>
</html>
