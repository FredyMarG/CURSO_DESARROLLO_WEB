<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laboratorio de Eventos de Teclado</title>
    <!-- Enlazamos la hoja de estilos externa para definir la apariencia visual -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Contenedor principal que centra el contenido en pantalla -->
    <div class="contenedor1">
        <h1>Eventos de Teclado</h1>
        <p>Interactúa con el campo de texto para ver los eventos en la consola.</p>

        <!-- Input de texto donde capturaremos las pulsaciones de teclas -->
        <input type="text" class="input-prueba" placeholder="Escribe algo aquí...">
    </div>

    <!-- Importamos el script de JavaScript al final para asegurar que el DOM esté cargado -->
    <script src="main.js"></script>
</body>
</html>
