<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guía Interactiva — Eventos de Mouse</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="hero">
        <div class="container">
            <span class="badge">Eventos del DOM</span>
            <h1>Eventos de Mouse &amp; Coordenadas</h1>
            <p class="subtitle">Prueba <code>click</code>, <code>dblclick</code>, <code>contextmenu</code>, <code>mouseenter</code>/<code>mouseleave</code> y <code>mousemove</code> en vivo.</p>
        </div>
    </header>

    <main class="container grid-layout">
        <section class="card">
            <h2>1. Área Interactiva de Mouse</h2>
            <p class="desc">Haz clic, doble clic, clic derecho o mueve el cursor dentro de este panel.</p>
            <div id="mousePad" class="mouse-pad" tabindex="0">
                <span id="coordsText">Mueve el cursor aquí (X: 0, Y: 0)</span>
            </div>
            <div class="btn-row">
                <button type="button" id="btnClearLog" class="btn">Limpiar Registro</button>
            </div>
        </section>

        <section class="card">
            <h2>2. Registro de Eventos</h2>
            <div id="mouseLog" class="terminal" aria-live="polite"></div>
        </section>
    </main>

    <script src="main.js"></script>
</body>
</html>
