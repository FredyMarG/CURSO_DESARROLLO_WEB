<!DOCTYPE html>
<!-- CURSO_WEB_DOC_HTML v1
     Archivo: JAVASCRIPT MID LEVEL/Location/location.html
     Título: Inspector de window.location
     Propósito: Demostrar las propiedades y métodos del objeto `window.location` mediante una interfaz interactiva.
     Relación: Las clases e IDs enlazan con `location.css` para estilos y `location.js` para la lógica de interacción.
-->
<!-- CURSO_WEB_HTML_STRUCT v1 -->


<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="location.css"> <!-- Enlace a la hoja de estilos CSS -->
    <title>Inspector de window.location</title> <!-- Título de la página que aparece en la pestaña del navegador -->
</head>
<body>
    <!-- Contenedor principal para la interfaz, centrado en la pantalla -->
    <div class="container">
        <!-- Encabezado principal de la aplicación -->
        <h1>Inspector de `window.location`</h1>
        <!-- Subtítulo descriptivo de la funcionalidad -->
        <p class="subtitle">Análisis en tiempo real de la URL del navegador</p>

        <!-- Tarjeta para mostrar las propiedades de window.location -->
        <div class="card">
            <!-- Cada div.data-item muestra una propiedad específica -->
            <div class="data-item"><strong>URL:</strong> <span id="href"></span></div>
            <div class="data-item"><strong>Host:</strong> <span id="host"></span></div>
            <div class="data-item"><strong>Ruta:</strong> <span id="path"></span></div>
            <div class="data-item"><strong>Protocolo:</strong> <span id="protocol"></span></div>
        </div>

        <!-- Sección de acciones con botones interactivos -->
        <div class="actions">
            <!-- Botón para recargar la página usando window.location.reload() -->
            <button class="btn btn-reload" onclick="window.location.reload()">🔄 Recargar</button>
            <!-- Botón para navegar a GitHub usando window.location.assign() -->
            <button class="btn btn-assign" onclick="window.location.assign('https://github.com')">🚀 Ir a GitHub</button>
        </div>
    </div>

    
    <script src="location.js"></script> <!-- Enlace al script JavaScript que maneja la lógica -->
</body>
<!-- Cierre del documento HTML -->
</html>
