<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS Mid Level - Elements Inspector</title>
    <link rel="stylesheet" href="style.css"> <!-- Vinculación de estilos para pruebas en vivo -->
</head>
<body>
    <!-- Main: Contenedor semántico principal -->
    <main class="dom-inspector-lab">
        <header>
            <h1>Laboratorio de Estructura (DOM)</h1>
            <p class="guide-text">Usa el inspector (Ctrl+Shift+C) para analizar las relaciones de este nodo.</p>
        </header>

        <!-- Bloque de inspección profunda -->
        <div class="node-container">
            <section class="nested-content">
                <h2>Árbol de Elementos</h2>
                <p>Nivel 1: Haz hover para ver el cambio de estado.</p>
                <p>Nivel 2: Edita este texto directamente en las DevTools.</p>
                <p>Nivel 3: Intenta duplicar este nodo en la pestaña Elements.</p>
            </section>
        </div>
    </main>

    <script src="elements.js"></script>
</body>
</html>
