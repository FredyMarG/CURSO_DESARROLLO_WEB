<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS Mid Level - Network Inspector</title>
    <link rel="stylesheet" href="style.css"> <!-- Vinculación de estilos para el laboratorio -->
</head>
<body>
    <!-- Main: Contenedor raíz para el laboratorio de redes -->
    <main class="network-lab">
        <header>
            <h1>Monitor de Recursos (Network)</h1>
            <p class="instruction-text">Filtra por 'Fetch/XHR' en las DevTools para ver el tráfico saliente.</p>
        </header>

        <!-- Bloque de visualización que emula un panel de control -->
        <div class="network-container">
            <section class="request-list">
                <h2>Últimas Peticiones</h2>
                <p><strong>GET</strong> /api/v1/user-profile - <span class="status">200 OK</span></p>
                <p><strong>POST</strong> /auth/login - <span class="status">201 Created</span></p>
                <p><strong>GET</strong> /assets/config.json - <span class="status error">404 Not Found</span></p>
            </section>
        </div>
    </main>

    <script src="networks.js"></script>
</body>
</html>
