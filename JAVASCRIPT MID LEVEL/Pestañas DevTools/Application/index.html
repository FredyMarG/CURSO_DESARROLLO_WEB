<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevTools Lab — Pestaña Application (Storage)</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="hero">
        <div class="container">
            <span class="badge">Chrome DevTools</span>
            <h1>Pestaña <code>Application</code>: LocalStorage &amp; SessionStorage</h1>
            <p class="subtitle">Guarda, lee y elimina claves en tiempo real mientras las inspeccionas en DevTools → Application.</p>
        </div>
    </header>

    <main class="container grid-layout">
        <section class="card">
            <h2>1. Editor de <code>localStorage</code> y <code>sessionStorage</code></h2>
            <div class="controls">
                <label for="keyInput">Clave:</label>
                <input id="keyInput" type="text" value="tema_usuario">
                <label for="valInput">Valor:</label>
                <input id="valInput" type="text" value="oscuro">
                <div class="btn-row">
                    <button type="button" id="btnSaveLocal" class="btn primary">Guardar en localStorage</button>
                    <button type="button" id="btnSaveSession" class="btn">Guardar en sessionStorage</button>
                    <button type="button" id="btnClearStorage" class="btn">Limpiar Todo</button>
                </div>
            </div>
        </section>

        <section class="card">
            <h2>2. Contenido Actual</h2>
            <div id="storageView" class="terminal" aria-live="polite"></div>
        </section>
    </main>

    <script src="application.js"></script>
</body>
</html>
