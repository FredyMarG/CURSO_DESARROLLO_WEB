<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS Mid Level - Resources/Sources Inspector</title>
    <link rel="stylesheet" href="style.css"> <!-- Vinculación de estilos técnicos -->
</head>
<body>
    <!-- Main: Contenedor semántico para el laboratorio de recursos -->
    <main class="resources-lab">
        <header>
            <h1>Explorador de Archivos (Sources)</h1>
            <p class="guide-text">Abre la pestaña 'Sources' para explorar la jerarquía de archivos del sitio.</p>
        </header>

        <!-- Terminal UI: Contenedor para simular la visualización de archivos cargados -->
        <div class="file-inspector">
            <section class="file-list">
                <h2>Archivos en Memoria</h2>
                <p><strong>📄 index.html</strong> - Estructura cargada</p>
                <p><strong>🎨 style.css</strong> - Estilos aplicados</p>
                <p><strong>⚡ resources.js</strong> - Lógica activa (intenta poner un breakpoint)</p>
            </section>
        </div>
    </main>

    <!-- Script para prácticas de Debugging y Snippets -->
    <script src="resources.js"></script>
</body>
</html>
