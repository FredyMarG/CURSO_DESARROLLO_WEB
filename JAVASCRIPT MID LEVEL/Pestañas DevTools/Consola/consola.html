<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css"> <!-- Vinculación de la hoja de estilos externa -->
    <title>JS Mid Level - Consola Inspector</title>
</head>
<body>
    <!-- Main: Punto de entrada semántico para el contenido principal de la aplicación -->
    <main class="console-lab">
        <header class="lab-header">
            <h1>Laboratorio de Depuración</h1>
            <p class="instruction-note">Abre las DevTools (F12) para interactuar con este módulo.</p>
        </header>
        
        <!-- Contenedor oscuro optimizado para visualización de logs -->
        <div class="terminal-container">
            <section class="log-section">
                <h2>Registro de Mensajes</h2>
                
                <!-- Elementos interactivos para pruebas de hover y selección -->
                <article class="log-entries">
                    <p><strong>[INFO]:</strong> Esperando interacción del usuario...</p>
                    <p><strong>[DEBUG]:</strong> El archivo consola.js ha sido cargado correctamente.</p>
                    <p><strong>[TASK]:</strong> Revisa la documentación en la pestaña "Console".</p>
                </article>
            </section>
        </div>
    </main>

    <!-- Script de lógica de consola -->
    <script src="consola.js"></script>
</body>
</html>
