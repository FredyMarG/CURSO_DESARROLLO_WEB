<!DOCTYPE html>
<html lang="es">
<head>
    <!-- 
        PROYECTO: Laboratorio de JavaScript (Nivel Medio)
        TEMA: Control de errores y excepciones.
        OBJETIVO: Ejecutar y demostrar el comportamiento de bloques try, catch y finally.
    -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laboratorio: Try - Catch</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">
        <header class="glass-header">
            <h1>⚠️ JavaScript Exceptions</h1>
            <p>Laboratorio de Control de Flujo y Errores</p>
        </header>

        <section class="info-card">
            <div class="status-badge">Modo Debug Activo</div>
            <h2>Entorno de Pruebas</h2>
            <p>El script <code>main.js</code> está analizando bloques críticos. Para ver la magia técnica:</p>
            
            <div class="instruction-box">
                <span>Presiona</span>
                <kbd>F12</kbd>
                <span>o</span>
                <kbd>Ctrl + Shift + I</kbd>
            </div>

            <div class="visual-flow">
                <div class="node try">Try</div>
                <div class="node catch">Catch</div>
                <div class="node finally">Finally</div>
            </div>
        </section>
    </main>

    <!-- 
        INCLUSIÓN DE LÓGICA:
        Se carga 'main.js' al final del body para garantizar que los elementos 
        del DOM (si los hubiera) se carguen antes de ejecutar el script.
    -->
    <script src="main.js"></script>
</body>
</html>
