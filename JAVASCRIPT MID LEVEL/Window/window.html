<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS Mid Level - Window Object Master</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Main: Contenedor raíz del laboratorio de interacción global -->
    <main class="window-dashboard">
        <header>
            <h1>Window Object Explorer</h1>
            <p class="subtitle">Laboratorio de métodos globales y control del navegador</p>
        </header>

        <div class="control-grid">
            <!-- Sección de interacción con el usuario -->
            <section class="control-card">
                <h2>💬 User Interaction</h2>
                <div class="button-group">
                    <button onclick="ejecutarAlert()" class="btn btn-indigo">Alert</button>
                    <button onclick="ejecutarPrompt()" class="btn btn-indigo">Prompt</button>
                    <button onclick="ejecutarConfirm()" class="btn btn-indigo">Confirm</button>
                </div>
            </section>

            <!-- Sección de gestión de ventanas -->
            <section class="control-card">
                <h2>🪟 Window Management</h2>
                <div class="button-group">
                    <button onclick="abrirVentana()" class="btn btn-blue">Open Window</button>
                    <button onclick="cerrarVentana()" class="btn btn-red">Close Window</button>
                </div>
            </section>

            <!-- Utilidades del sistema -->
            <section class="control-card">
                <h2>⚙️ System Utilities</h2>
                <div class="button-group">
                    <button onclick="window.print()" class="btn btn-slate">Print Page</button>
                    <button onclick="window.stop()" class="btn btn-slate">Stop Load</button>
                </div>
            </section>
        </div>
    </main>
    <script src="window.js"></script>
</body>
</html>
