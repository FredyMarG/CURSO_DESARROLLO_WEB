<!doctype html>
<!-- Visor de documentación técnica para Node.js -->
<html lang="es">
<head>
    <!-- Codificación UTF-8 para tildes, ñ y símbolos -->
    <meta charset="UTF-8" />
    <!-- Escala inicial responsiva para escritorio y móvil -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Descripción del centro de apuntes de Node.js -->
    <meta name="description" content="Centro de apuntes y guías Markdown de Node.js: Introducción, Fundamentos, Instalación, JS Moderno, Asincronía, Archivos Nativos, REPL y Módulos." />
    <title>🟢 Apuntes Completos de Node.js | Curso Desarrollo Web</title>
    <!-- Preconexión a Google Fonts para acelerar carga de fuentes -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Tipografías Outfit (interfaz) y Fira Code (código) -->
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <!-- Cargamos los datos locales de los apuntes y soporte visual para diagramas Mermaid (defer) -->
    <script src="docs-data.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js" defer></script>
    <style>
        /* ==================================================================
           ESTILOS DEL LECTOR DE DOCUMENTACIÓN DE NODE.JS (3 COLUMNAS)
           Comentado línea por línea en español
           ================================================================== */

        /* Variables globales de color y tipografía */
        :root {
            --bg: #070a13; /* Fondo oscuro principal */
            --card: rgba(16, 24, 42, 0.85); /* Fondo translúcido para paneles */
            --border: rgba(255, 255, 255, 0.1); /* Borde fino semitransparente */
            --primary: #10b981; /* Verde esmeralda distintivo de Node.js */
            --cyan: #38bdf8; /* Azul cian para acentos y subtítulos */
            --text: #f1f5f9; /* Color de texto principal claro */
            --muted: #94a3b8; /* Color de texto secundario */
            --sans: 'Outfit', system-ui, sans-serif; /* Tipografía principal */
            --mono: 'Fira Code', monospace; /* Tipografía monoespaciada */
        }

        /* Barras de desplazamiento personalizadas en verde Node.js */
        * { scrollbar-width: thin; scrollbar-color: rgba(16, 185, 129, 0.45) #070a13; }
        /* Tamaño de barra WebKit */
        ::-webkit-scrollbar { width: 10px; height: 10px; }
        /* Carril oscuro */
        ::-webkit-scrollbar-track { background: #070a13; }
        /* Pulgar redondeado verde Node.js */
        ::-webkit-scrollbar-thumb { background: rgba(16, 185, 129, 0.45); border-radius: 999px; border: 2px solid #070a13; }
        /* Pulgar iluminado al pasar el ratón */
        ::-webkit-scrollbar-thumb:hover { background: var(--primary); }

        /* Normalización global de márgenes, rellenos y modelo de caja */
        * { box-sizing: border-box; margin: 0; padding: 0; }

        /* Configuración base del cuerpo del documento */
        body {
            background: var(--bg); /* Aplica fondo oscuro */
            color: var(--text); /* Aplica texto claro */
            font-family: var(--sans); /* Aplica fuente principal */
            min-height: 100vh; /* Ocupa al menos toda la altura de pantalla */
            display: flex; /* Contenedor flex vertical */
            flex-direction: column; /* Apila barra superior y área principal */
        }

        /* Barra superior fija con efecto desenfoque */
        .topbar {
            position: sticky; /* Se mantiene fija al hacer scroll */
            top: 0; /* Anclada al borde superior */
            z-index: 40; /* Por encima del contenido */
            background: rgba(7, 10, 19, 0.92); /* Fondo semitransparente */
            backdrop-filter: blur(14px); /* Efecto cristal esmerilado */
            border-bottom: 1px solid var(--border); /* Línea divisoria inferior */
            padding: 12px 24px; /* Relleno interno */
            display: flex; /* Distribución horizontal */
            align-items: center; /* Centrado vertical */
            justify-content: space-between; /* Separa marca y acciones */
            gap: 14px; /* Espacio entre elementos */
            flex-wrap: wrap; /* Permite envolver en móviles */
        }

        /* Contenedor de insignia y título */
        .brand { display: flex; align-items: center; gap: 12px; }

        /* Insignia identificadora del módulo */
        .badge {
            font-family: var(--mono); /* Fuente monoespaciada */
            font-size: 0.72rem; /* Tamaño compacto */
            font-weight: 600; /* Seminegrita */
            color: var(--primary); /* Texto verde Node.js */
            background: rgba(16, 185, 129, 0.12); /* Fondo verde suave */
            border: 1px solid rgba(16, 185, 129, 0.35); /* Borde verde */
            padding: 4px 10px; /* Relleno interno */
            border-radius: 999px; /* Forma de píldora */
        }

        /* Título de la barra superior */
        .title { font-weight: 700; font-size: 1.05rem; }

        /* Botones de navegación de la barra superior */
        .btn {
            background: rgba(255, 255, 255, 0.06); /* Fondo sutil */
            color: var(--text); /* Texto claro */
            border: 1px solid var(--border); /* Borde fino */
            border-radius: 10px; /* Esquinas redondeadas */
            padding: 7px 14px; /* Relleno interno */
            font-family: var(--sans); /* Fuente principal */
            font-size: 0.85rem; /* Tamaño legible */
            font-weight: 600; /* Seminegrita */
            text-decoration: none; /* Sin subrayado */
            cursor: pointer; /* Cursor interactivo */
        }

        /* Resaltado al pasar el ratón sobre los botones */
        .btn:hover { border-color: var(--primary); background: rgba(16, 185, 129, 0.14); }

        /* Rejilla de 3 columnas: lista de apuntes, lector y tabla de contenido */
        .layout {
            max-width: 1420px; /* Ancho máximo en pantallas grandes */
            width: 100%; /* Ocupa todo el ancho disponible */
            margin: 0 auto; /* Centrado horizontal */
            display: grid; /* Activa CSS Grid */
            grid-template-columns: 270px 1fr 240px; /* 3 columnas proporcionales */
            gap: 20px; /* Separación entre columnas */
            padding: 22px; /* Margen interno */
            flex: 1; /* Crece para llenar el alto disponible */
        }

        /* Paneles laterales fijos (lista de documentos e índice) */
        .sidebar, .toc {
            background: var(--card); /* Fondo de tarjeta */
            border: 1px solid var(--border); /* Borde fino */
            border-radius: 16px; /* Esquinas redondeadas */
            padding: 16px; /* Relleno interno */
            height: fit-content; /* Se ajusta a su contenido */
            position: sticky; /* Se mantiene visible al hacer scroll */
            top: 80px; /* Separación respecto a la barra superior */
            max-height: calc(100vh - 100px); /* Limita alto al viewport */
            overflow-y: auto; /* Scroll interno si hay muchos elementos */
        }

        /* Campo de búsqueda de apuntes */
        .search-box {
            width: 100%; /* Ocupa todo el ancho lateral */
            background: #060913; /* Fondo oscuro profundo */
            color: var(--text); /* Texto claro */
            border: 1px solid var(--border); /* Borde fino */
            border-radius: 10px; /* Esquinas redondeadas */
            padding: 9px 12px; /* Relleno interno */
            font-family: var(--sans); /* Fuente principal */
            font-size: 0.88rem; /* Tamaño cómodo */
            margin-bottom: 12px; /* Separación inferior */
            outline: none; /* Quita contorno nativo */
        }

        /* Resalta el borde al enfocar el buscador */
        .search-box:focus { border-color: var(--primary); }

        /* Contenedor vertical de la lista de documentos */
        .doc-list { display: flex; flex-direction: column; gap: 6px; }

        /* Botón individual de cada apunte en la barra lateral */
        .doc-item {
            display: flex; /* Disposición flex */
            flex-direction: column; /* Apila título y nombre de archivo */
            gap: 2px; /* Espacio mínimo entre líneas */
            background: transparent; /* Fondo transparente por defecto */
            border: 1px solid transparent; /* Borde invisible por defecto */
            border-radius: 10px; /* Esquinas redondeadas */
            padding: 10px 12px; /* Relleno interno */
            text-align: left; /* Alineación izquierda */
            color: var(--text); /* Texto claro */
            font-family: var(--sans); /* Fuente principal */
            cursor: pointer; /* Cursor interactivo */
        }

        /* Efecto hover en los botones de la lista */
        .doc-item:hover { background: rgba(255, 255, 255, 0.04); border-color: var(--border); }

        /* Estado activo del apunte seleccionado */
        .doc-item.active { background: rgba(16, 185, 129, 0.14); border-color: var(--primary); }

        /* Título del apunte en el botón */
        .doc-item strong { font-size: 0.9rem; }

        /* Nombre del archivo .md debajo del título */
        .doc-item span { font-size: 0.74rem; color: var(--muted); font-family: var(--mono); }

        /* Título del panel de índice derecho */
        .toc-title {
            font-size: 0.78rem; /* Tamaño compacto */
            font-family: var(--mono); /* Fuente monoespaciada */
            color: var(--primary); /* Verde Node.js */
            text-transform: uppercase; /* Mayúsculas */
            letter-spacing: 0.06em; /* Espaciado entre letras */
            margin-bottom: 10px; /* Separación inferior */
        }

        /* Lista vertical de enlaces del índice */
        .toc-list { display: flex; flex-direction: column; gap: 6px; }

        /* Enlace individual del índice */
        .toc-link { color: var(--muted); text-decoration: none; font-size: 0.82rem; line-height: 1.35; }

        /* Color resaltado al pasar el ratón por el índice */
        .toc-link:hover { color: var(--primary); }

        /* Sangría adicional para subtítulos de nivel 3 */
        .toc-link.lvl-3 { padding-left: 12px; font-size: 0.78rem; }

        /* Panel central de lectura Markdown */
        .reader { background: var(--card); border: 1px solid var(--border); border-radius: 18px; padding: 28px 34px; min-width: 0; }

        /* Cabecera del documento seleccionado */
        .reader-head {
            display: flex; /* Disposición horizontal */
            justify-content: space-between; /* Separa título y enlace original */
            align-items: center; /* Centrado vertical */
            flex-wrap: wrap; /* Permite salto en pantallas pequeñas */
            gap: 12px; /* Espacio entre elementos */
            padding-bottom: 16px; /* Relleno inferior */
            margin-bottom: 22px; /* Separación respecto al cuerpo */
            border-bottom: 1px solid var(--border); /* Línea divisoria */
        }

        /* Título principal del apunte activo */
        .reader-head h1 { font-size: 1.7rem; font-weight: 800; color: #fff; }

        /* Cuerpo tipográfico del Markdown renderizado */
        .md-body { line-height: 1.74; color: #cbd5e1; font-size: 0.98rem; }

        /* Encabezados dentro del cuerpo Markdown */
        .md-body h1, .md-body h2, .md-body h3 { color: #fff; margin: 1.4em 0 0.6em; line-height: 1.3; scroll-margin-top: 84px; }

        /* Encabezados de nivel 2 con línea inferior y color verde */
        .md-body h2 { font-size: 1.38rem; color: var(--primary); border-bottom: 1px solid var(--border); padding-bottom: 6px; }

        /* Margen inferior de párrafos */
        .md-body p { margin-bottom: 0.95em; }

        /* Listas con viñetas y numeradas */
        .md-body ul, .md-body ol { padding-left: 22px; margin-bottom: 1em; }

        /* Código en línea */
        .md-body code { font-family: var(--mono); font-size: 0.84em; background: rgba(16, 185, 129, 0.12); color: #34d399; padding: 2px 6px; border-radius: 5px; }

        /* Contenedor de bloque de código con botón de copia */
        .code-wrap { position: relative; margin: 14px 0; }

        /* Botón flotante para copiar bloques de código */
        .copy-btn {
            position: absolute; /* Posicionado en la esquina superior derecha */
            top: 8px; /* Margen superior */
            right: 8px; /* Margen derecho */
            background: rgba(255, 255, 255, 0.08); /* Fondo sutil */
            color: #cbd5e1; /* Texto claro */
            border: 1px solid var(--border); /* Borde fino */
            border-radius: 6px; /* Esquinas redondeadas */
            padding: 4px 10px; /* Relleno interno */
            font-family: var(--mono); /* Fuente monoespaciada */
            font-size: 0.72rem; /* Tamaño compacto */
            cursor: pointer; /* Cursor interactivo */
        }

        /* Hover del botón copiar */
        .copy-btn:hover { background: var(--primary); color: #070a13; }

        /* Bloques <pre> de código multilínea */
        .md-body pre { background: #050811; border: 1px solid var(--border); border-radius: 12px; padding: 16px; overflow-x: auto; }

        /* Código dentro de <pre> sin fondo duplicado */
        .md-body pre code { background: none; color: #34d399; padding: 0; font-size: 0.85rem; }

        /* Bloques de cita y notas importantes */
        .md-body blockquote { border-left: 4px solid var(--primary); background: rgba(16, 185, 129, 0.08); padding: 10px 16px; border-radius: 0 10px 10px 0; margin: 12px 0; }

        /* Tablas Markdown con scroll horizontal en pantallas estrechas */
        .md-body table { width: 100%; border-collapse: collapse; margin: 14px 0; font-size: 0.9rem; overflow-x: auto; display: block; }
        /* Celdas y encabezados de tabla con borde sutil */
        .md-body th, .md-body td { border: 1px solid var(--border); padding: 9px 12px; text-align: left; }
        /* Cabecera de tabla resaltada en verde Node.js */
        .md-body th { background: rgba(16, 185, 129, 0.14); color: var(--primary); font-weight: 700; }
        /* Filas alternas para facilitar la lectura */
        .md-body tr:nth-child(even) td { background: rgba(255, 255, 255, 0.02); }
        /* Separador horizontal Markdown (---) */
        .md-body hr { border: none; border-top: 1px solid var(--border); margin: 20px 0; }
        /* Contenedor oscuro para diagramas Mermaid */
        .md-body .mermaid { background: #050811; border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin: 14px 0; overflow-x: auto; text-align: center; }

        /* Reglas responsivas para tabletas (oculta el índice derecho) */
        @media (max-width: 1120px) { .layout { grid-template-columns: 260px 1fr; } .toc { display: none; } }

        /* Reglas responsivas para móviles (apila las columnas) */
        @media (max-width: 820px) { .layout { grid-template-columns: 1fr; } .sidebar { position: static; max-height: none; } }
    </style>
    <!-- Favicon oficial de Node.js en Flaticon para la pestaña del navegador -->
    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/5968/5968322.png" />

    <script src="../../RESOURCES COURSE/plantilla/docs-switcher.js" defer></script>
</head>
<body>
    <header class="topbar">
        <div class="brand">
            <span class="badge">NODE.JS · DOCUMENTACIÓN</span>
            <span class="title">🟢 Apuntes Completos de Node.js</span>
        </div>
        <div style="display:flex;gap:10px;flex-wrap:wrap;">
            <a class="btn" href="../../index.html?filter=node">🟢 Módulos Node.js</a>
            <a class="btn" href="../../index.html?filter=proyectos">🚀 Proyectos</a>
            <a class="btn" href="../../index.html">🏠 Portal Principal</a>
        </div>
    </header>
    <div class="layout">
        <aside class="sidebar">
            <input type="search" id="docSearch" class="search-box" placeholder="Buscar en apuntes..." />
            <div class="doc-list" id="docList"></div>
        </aside>
        <main class="reader">
            <div class="reader-head">
                <h1 id="docTitle">Selecciona un apunte</h1>
                <a id="moduleBtn" class="btn" href="../Fundamentos/index.html">🎯 Ir al Módulo</a>
            </div>
            <div id="docContent" class="md-body"></div>
        </main>
        <aside class="toc">
            <div class="toc-title">📑 Índice</div>
            <div class="toc-list" id="tocList"></div>
        </aside>
    </div>
    <script>
        // Activamos el modo estricto de JavaScript
        "use strict";

        // Catálogo completo de las 10 guías Markdown en orden progresivo de aprendizaje
        const DOCS = [
            { file: "INTRODUCCION.md", title: "01. Introducción a Node.js", module: "../Introduccion/index.html" },
            { file: "FUNDAMENTOS.md", title: "02. Fundamentos de Node.js", module: "../Fundamentos/index.html" },
            { file: "INSTALACION.md", title: "03. Instalación y Entorno", module: "../Instalacion/index.html" },
            { file: "REPL.md", title: "04. REPL de Node.js", module: "../REPL/index.html" },
            { file: "JAVASCRIPT MODERNO.md", title: "05. JavaScript Moderno", module: "../JavaScriptModerno/index.html" },
            { file: "ARQUITECTURA INTERNA ASINCRONIA.md", title: "06. Arquitectura y Asincronía", module: "../Asincronia/index.html" },
            { file: "ARCHIVOS NATIVOS.md", title: "07. Módulos Nativos y Archivos", module: "../ArchivosNativos/index.html" },
            { file: "EVENTOS Y STREAMS.md", title: "08. Eventos y Streams", module: "../EventosStreams/index.html" },
            { file: "CRYPTO Y SEGURIDAD.md", title: "09. Criptografía y Seguridad", module: "../CryptoSeguridad/index.html" },
            { file: "MODULOS.md", title: "10. Módulos en Node.js", module: "../Modulos/index.html" }
        ];

        // Referencias a los elementos principales del DOM
        const docList = document.getElementById("docList"); // Lista lateral de apuntes
        const docSearch = document.getElementById("docSearch"); // Campo de búsqueda
        const docTitle = document.getElementById("docTitle"); // Título superior del apunte
        const docContent = document.getElementById("docContent"); // Contenedor del contenido renderizado
        const tocList = document.getElementById("tocList"); // Contenedor del índice derecho
        const moduleBtn = document.getElementById("moduleBtn"); // Botón dinámico hacia el módulo interactivo

        // Almacena el nombre del archivo actualmente seleccionado
        let activeFile = DOCS[0].file;

        // Escapa caracteres especiales HTML para evitar inyecciones al renderizar texto
        const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

        // Formatea sintaxis en línea: código, negritas y cursivas
        const fmt = (t) =>
            esc(t)
                .replace(/`([^`]+)`/g, "<code>$1</code>") // Código en línea
                .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>") // Negritas
                .replace(/\*([^*]+)\*/g, "<em>$1</em>"); // Cursivas

        // Convierte texto Markdown en HTML estructurado (incluye listas ordenadas, tablas, Mermaid y separadores) y genera el índice lateral
        function renderMd(md) {
            const lines = md.replace(/\r\n/g, "\n").split("\n");
            let html = "", inCode = false, codeLang = "", listTag = "", inTable = false, hIdx = 0, toc = [];
            const closeList = () => { if (listTag) { html += `</${listTag}>`; listTag = ""; } };
            const closeTable = () => { if (inTable) { html += "</tbody></table>"; inTable = false; } };

            for (const line of lines) {
                if (line.trim().startsWith("```")) {
                    closeList(); closeTable();
                    if (!inCode) {
                        codeLang = line.trim().slice(3).trim().toLowerCase();
                        html += codeLang === "mermaid"
                            ? '<div class="mermaid">'
                            : '<div class="code-wrap"><button class="copy-btn">Copiar</button><pre><code>';
                        inCode = true;
                    } else {
                        html += codeLang === "mermaid" ? "</div>" : "</code></pre></div>";
                        inCode = false;
                        codeLang = "";
                    }
                    continue;
                }
                if (inCode) { html += esc(line) + "\n"; continue; }

                const tr = line.trim();
                if (!tr) { closeList(); closeTable(); continue; }

                if (tr.startsWith("|") && tr.endsWith("|")) {
                    closeList();
                    const cells = tr.slice(1, -1).split("|").map(c => c.trim());
                    if (cells.every(c => /^:?-{2,}:?$/.test(c))) continue;
                    if (!inTable) {
                        inTable = true;
                        html += "<table><thead><tr>" + cells.map(c => `<th>${fmt(c)}</th>`).join("") + "</tr></thead><tbody>";
                    } else {
                        html += "<tr>" + cells.map(c => `<td>${fmt(c)}</td>`).join("") + "</tr>";
                    }
                    continue;
                }
                closeTable();

                if (/^---+$/.test(tr)) {
                    closeList();
                    html += "<hr>";
                } else if (/^#{1,3}\s+/.test(tr)) {
                    closeList();
                    const lvl = tr.match(/^(#{1,3})/)[1].length;
                    const raw = tr.replace(/^#{1,3}\s+/, "");
                    const id = "s-" + (++hIdx);
                    if (lvl >= 1 && hIdx > 1) toc.push({ id, lvl, text: raw.replace(/`/g, "") });
                    html += `<h${lvl} id="${id}">${fmt(raw)}</h${lvl}>`;
                } else if (/^[-*]\s+/.test(tr)) {
                    if (listTag !== "ul") { closeList(); html += "<ul>"; listTag = "ul"; }
                    html += `<li>${fmt(tr.replace(/^[-*]\s+/, ""))}</li>`;
                } else if (/^\d+\.\s+/.test(tr)) {
                    if (listTag !== "ol") { closeList(); html += "<ol>"; listTag = "ol"; }
                    html += `<li>${fmt(tr.replace(/^\d+\.\s+/, ""))}</li>`;
                } else if (tr.startsWith(">")) {
                    closeList();
                    html += `<blockquote>${fmt(tr.replace(/^>\s*/, ""))}</blockquote>`;
                } else {
                    closeList();
                    html += `<p>${fmt(tr)}</p>`;
                }
            }
            closeList();
            closeTable();
            if (inCode) html += codeLang === "mermaid" ? "</div>" : "</code></pre></div>";
            return { html, toc };
        }

        // Carga y renderiza el apunte seleccionado en el lector central
        function loadDoc(doc) {
            activeFile = doc.file; // Actualiza archivo activo
            docTitle.textContent = doc.title; // Actualiza título en cabecera
            if (moduleBtn && doc.module) moduleBtn.href = encodeURI(doc.module); // Enlaza al módulo interactivo del apunte
            try {
                const u = new URL(window.location.href);
                u.searchParams.set("doc", doc.file);
                history.replaceState(null, "", u.toString());
            } catch (_) {}
            renderSidebar(docSearch.value); // Actualiza estado activo en la barra lateral

            // Lee el contenido desde window.DOCS_CONTENT (cargado por docs-data.js)
            const md = (window.DOCS_CONTENT && window.DOCS_CONTENT[doc.file]) || "";
            const { html, toc } = renderMd(md); // Convierte Markdown a HTML e índice
            docContent.innerHTML = html; // Inserta el contenido en el DOM

            // Renderiza diagramas Mermaid si la librería cargó correctamente
            if (window.mermaid && docContent.querySelector(".mermaid")) {
                try {
                    window.mermaid.initialize({ startOnLoad: false, theme: "dark" });
                    window.mermaid.run({ nodes: docContent.querySelectorAll(".mermaid") });
                } catch (_) {}
            }

            // Renderiza todos los enlaces del documento en la tabla de contenido derecha
            tocList.innerHTML = toc
                .map((t) => `<a class="toc-link lvl-${t.lvl}" href="#${t.id}">${esc(t.text)}</a>`)
                .join("");

            // Activa los botones "Copiar" en todos los bloques de código
            docContent.querySelectorAll(".copy-btn").forEach((b) =>
                b.addEventListener("click", () => {
                    navigator.clipboard?.writeText(b.nextElementSibling?.textContent || "");
                    b.textContent = "¡Copiado!";
                    setTimeout(() => (b.textContent = "Copiar"), 1400);
                })
            );
        }

        // Dibuja la lista de apuntes en la barra lateral aplicando el filtro de búsqueda
        function renderSidebar(q = "") {
            const term = q.trim().toLowerCase(); // Término de búsqueda en minúsculas
            docList.innerHTML = ""; // Limpia la lista previa
            DOCS.filter(
                (d) =>
                    !term ||
                    d.title.toLowerCase().includes(term) ||
                    ((window.DOCS_CONTENT && window.DOCS_CONTENT[d.file]) || "").toLowerCase().includes(term)
            ).forEach((doc) => {
                // Creamos un botón para cada apunte coincidente
                const b = document.createElement("button");
                b.className = "doc-item" + (doc.file === activeFile ? " active" : "");
                b.innerHTML = `<strong>${doc.title}</strong><span>${doc.file}</span>`;
                b.addEventListener("click", () => loadDoc(doc));
                docList.appendChild(b);
            });
        }

        // Escucha cambios en el buscador para filtrar en tiempo real
        docSearch.addEventListener("input", () => renderSidebar(docSearch.value));

        // Carga el apunte indicado por ?doc= o el primero por defecto
        const requestedDoc = new URLSearchParams(window.location.search).get("doc");
        const initialDoc = DOCS.find(d => d.file.toLowerCase() === (requestedDoc || "").toLowerCase()) || DOCS[0];
        loadDoc(initialDoc);
    </script>
</body>
</html>
