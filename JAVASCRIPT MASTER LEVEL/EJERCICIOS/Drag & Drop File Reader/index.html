<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drag & Drop FileReader | Master Level</title>
    <!-- Google Fonts: Outfit para textos y Fira Code para métricas y código -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Hoja de estilos vinculada -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Contenedor principal que estructura y centra la aplicación -->
    <div class="contenedor-app">
        <!-- Encabezado con título principal y descripción -->
        <header class="encabezado">
            <span class="badge-modulo">JAVASCRIPT MASTER LEVEL</span>
            <h1 class="titulo-principal">📁 Drag &amp; Drop File Reader</h1>
            <p class="subtitulo">Arrastra y suelta imágenes, videos o documentos de texto para procesarlos con barra de carga en tiempo real</p>
        </header>

        <!-- Zona interactiva donde el usuario arrastra y suelte el archivo -->
        <div class="zona-arrastre">
            arrastre y suelte un archivo
        </div>

        <!-- Contenedor pista de la barra de carga que permite apreciar la transición fluida -->
        <div class="contenedor-barra">
            <!-- Barra interior animada que expande su ancho del 0% al 100% -->
            <div class="barra-de-carga"></div>
            <!-- Etiqueta central que proyecta con total nitidez el porcentaje de carga en tiempo real -->
            <span class="porcentaje-carga">0%</span>
        </div>

        <!-- Contenedor donde se renderiza el resultado final (texto, imagen o video) -->
        <div class="resultado"></div>
    </div>

    <!-- Script de lógica de la aplicación -->
    <script src="main.js"></script>
</body>
</html>
