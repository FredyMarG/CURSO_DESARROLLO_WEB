<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Interactivo — Curso de Desarrollo Web</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="RESOURCES COURSE/style.css">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20viewBox%3D'0%200%2064%2064'%3E%3Crect%20width%3D'64'%20height%3D'64'%20rx%3D'14'%20fill%3D'%230b1120'%20stroke%3D'%2300f0ff'%20stroke-width%3D'4'%2F%3E%3Ctext%20x%3D'50%25'%20y%3D'54%25'%20dominant-baseline%3D'middle'%20text-anchor%3D'middle'%20font-size%3D'36'%3E%F0%9F%92%BB%3C%2Ftext%3E%3C%2Fsvg%3E" />
</head>
<body>
    <div class="bg-glow glow-1"></div>
    <div class="bg-glow glow-2"></div>

    <div class="container">
        <header>
            <span class="badge">CURSO DESARROLLO WEB — RUTA COMPLETA</span>
            <h1>Portal Interactivo de Aprendizaje</h1>
            <p class="subtitle">
                Aprende desarrollo web paso a paso: elige tu nivel abajo, prueba los laboratorios interactivos y refuerza con los ejercicios prácticos.
            </p>
        </header>

        <!-- Ruta visual guiada para principiantes -->
        <section class="learning-path" aria-label="Ruta recomendada de estudio">
            <button class="path-step" data-jump="htmlcss">
                <span class="step-num">Paso 1</span>
                <strong>
                    <span class="tech-icon tech-icon-sm" aria-hidden="true"><img src="https://cdn-icons-png.flaticon.com/512/174/174854.png" alt=""></span>
                    <span class="tech-icon tech-icon-sm" aria-hidden="true"><img src="https://cdn-icons-png.flaticon.com/512/732/732190.png" alt=""></span>
                    HTML y CSS
                </strong>
                <small>Estructura y diseño visual</small>
            </button>
            <span class="path-arrow">➔</span>
            <button class="path-step" data-jump="junior">
                <span class="step-num">Paso 2</span>
                <strong><span class="tech-icon tech-icon-sm" aria-hidden="true"><img src="https://cdn-icons-png.flaticon.com/512/5968/5968292.png" alt=""></span> JS Junior</strong>
                <small>Lógica, variables, DOM y POO</small>
            </button>
            <span class="path-arrow">➔</span>
            <button class="path-step" data-jump="mid">
                <span class="step-num">Paso 3</span>
                <strong><span class="tech-icon tech-icon-sm" aria-hidden="true"><img src="https://cdn-icons-png.flaticon.com/512/5968/5968292.png" alt=""></span> JS Mid</strong>
                <small>Eventos, Promesas y Fetch</small>
            </button>
            <span class="path-arrow">➔</span>
            <button class="path-step" data-jump="master">
                <span class="step-num">Paso 4</span>
                <strong><span class="tech-icon tech-icon-sm" aria-hidden="true"><img src="https://cdn-icons-png.flaticon.com/512/5968/5968292.png" alt=""></span> JS Master</strong>
                <small>APIs modernas y rendimiento</small>
            </button>
            <span class="path-arrow">➔</span>
            <button class="path-step" data-jump="node">
                <span class="step-num">Paso 5</span>
                <strong><span class="tech-icon tech-icon-sm" aria-hidden="true"><img src="https://cdn-icons-png.flaticon.com/512/5968/5968322.png" alt=""></span> Node.js</strong>
                <small>Backend, HTTP y APIs</small>
            </button>
            <span class="path-arrow">➔</span>
            <button class="path-step" data-jump="ejercicios">
                <span class="step-num">Práctica</span>
                <strong>🧪 Ejercicios</strong>
                <small>Retos reales paso a paso</small>
            </button>
            <span class="path-arrow">➔</span>
            <button class="path-step" data-jump="proyectos">
                <span class="step-num">Portafolio</span>
                <strong>💼 Proyectos</strong>
                <small>Componentes y webs reales</small>
            </button>
        </section>

        <div class="toolbar">
            <input type="text" class="search-input" id="searchInput" placeholder="🔍 Buscar tema (ej. Node.js, Fetch, Grid, IndexedDB)...">
            <button class="filter-btn active" data-filter="all">Todos</button>
            <button class="filter-btn" data-filter="node">Node.js</button>
            <button class="filter-btn" data-filter="master">JS Master Level</button>
            <button class="filter-btn" data-filter="mid">JS Mid Level</button>
            <button class="filter-btn" data-filter="junior">JS Junior Level</button>
            <button class="filter-btn" data-filter="htmlcss">HTML y CSS</button>
            <button class="filter-btn" data-filter="ejercicios">Ejercicios</button>
            <button class="filter-btn" data-filter="proyectos">Proyectos</button>
        </div>

        <main id="portalContent"></main>
    </div>

    <script src="RESOURCES COURSE/app.js" defer></script>
</body>
</html>
