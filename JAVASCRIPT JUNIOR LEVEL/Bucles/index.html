<!DOCTYPE html>
<!-- 
    LABORATORIO MAESTRO: ESTRUCTURAS DE CONTROL (BUCLES)

-->
<html lang="es">
<head>
    <meta charset="UTF-8"> <!-- Encoding UTF-8 para compatibilidad global -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Prevención de zoom automático en móviles -->
    
    <!-- Título descriptivo para la pestaña del navegador -->
    <title>JS Junior - Control de Bucles</title>

    <!-- Vinculación del diseño externo para bucles (Separación de capas) -->

</head>
<body>
    <div class="card">
        <header>
            <div class="icon">↺</div>

                <span class="status-dot"></span>
