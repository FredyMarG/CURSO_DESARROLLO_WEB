<!DOCTYPE html> <!-- Definición de tipo de documento para HTML5 -->

<!-- 
    LABORATORIO: VARIABLES Y TIPOS DE DATOS
    Nivel: Junior Level
    Propósito: Entorno de ejecución para el motor de JS (V8/SpiderMonkey). 
    En este módulo se prueban las interacciones síncronas (prompt/alert) y la consola.
-->
<html lang="es">
<head>
    <!-- Meta-información técnica -->
    <meta charset="UTF-8"> <!-- Garantiza el renderizado de caracteres UTF-8 (acentos, ñ) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Viewport: Fundamental para el diseño responsivo en móviles -->

    <!-- El título es indexado por motores de búsqueda (SEO) -->
    <title>JS Junior - Variables y Tipos</title>
    <!-- Vinculación del archivo de estilos externo (Separación de responsabilidades) -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Interfaz de usuario simple para visualización -->
    <div class="container">
        <h1>Práctica de Variables</h1>
        <p>La lógica se procesa mediante <b>ventanas emergentes</b> y la <b>consola</b>.</p>
        <p>Presiona <code>Ctrl + Shift + I</code> para ver los resultados del <code>console.log</code>.</p>
    </div>

    <!-- 
        VINCULACIÓN DE LÓGICA:
        Se carga al final del body para no interrumpir el análisis (parsing) del DOM.
        'variables.js' maneja la entrada de datos del usuario.
    -->
    <script src="variables.js"></script>
</body>
</html>
