<!DOCTYPE html>
<!-- 
    LABORATORIO INTEGRADO: DOM (DOCUMENT OBJECT MODEL)
    Este archivo unifica las prácticas de atributos, estilos, classList y navegación 
    entre nodos (hijos, padres y hermanos).
-->
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Enlace a la hoja de estilos externa para mantener la separación de intereses (Separation of Concerns) -->
    <link rel="stylesheet" href="style.css">
    <title>Aprendiendo el DOM - Junior Level</title>
</head>
<body>
    <div class="card">
        <!-- Atributo 'title': Proporciona información adicional (Tooltip nativo) -->
        <h1 class="titulo" title="Encabezado principal">Manipulación del DOM</h1>

        <!-- Input fuera de formulario para pruebas de selección directa -->
        <input type="text" class="input-normal" id="input-externo" placeholder="Input independiente">

        <!-- Estructura de Formulario -->
        <form id="formulario">
            <div class="field-group">
                <label for="nombre">Nombre de usuario:</label>
                <input type="text" class="input-normal" id="nombre" placeholder="Ej: Fredy">
            </div>
            
            <div class="field-group">
                <label for="archivo">Subir evidencia:</label>
                <input type="file" class="input-normal" id="archivo">
            </div>
        </form>

        <button type="submit" form="formulario">Enviar Datos</button>

        <hr>

        <!-- Manipulación de contenido y estilos -->
        <p class="style">Elemento a <b>modificar</b> mediante JS</p>

        <!-- Contenedor para prácticas de navegación (Padres/Hijos/Hermanos) -->
        <div class="contenedor" style="margin-top: 20px; border: 1px dashed #ccc; padding: 10px;">
            <h2>Subtítulo antiguo</h2>
            <p>Este es el primer hijo del contenedor.</p>
        </div>

        <div class="status-box" style="margin-top: 20px;">
            <span class="status-dot"></span>
            <span>Resultados en <b>Consola (Ctrl + Shift + I)</b></span>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
