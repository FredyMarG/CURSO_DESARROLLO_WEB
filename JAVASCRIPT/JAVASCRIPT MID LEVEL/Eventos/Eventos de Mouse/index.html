<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guía Interactiva — Eventos de Mouse</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20viewBox%3D'0%200%2064%2064'%3E%3Crect%20width%3D'64'%20height%3D'64'%20rx%3D'14'%20fill%3D'%230b1120'%20stroke%3D'%23ec4899'%20stroke-width%3D'4'%2F%3E%3Ctext%20x%3D'50%25'%20y%3D'54%25'%20dominant-baseline%3D'middle'%20text-anchor%3D'middle'%20font-size%3D'36'%3E%F0%9F%8E%AF%3C%2Ftext%3E%3C%2Fsvg%3E" />
</head>
<body>
    <header class="hero">
        <div class="container">
            <span class="badge">Eventos del DOM</span>
            <h1>Eventos de Mouse &amp; Coordenadas</h1>
            <p class="subtitle">Prueba <code>click</code>, <code>dblclick</code>, <code>contextmenu</code>, <code>mouseenter</code>/<code>mouseleave</code> y <code>mousemove</code> en vivo.</p>
        </div>
    </header>

    <main class="container grid-layout">
        <section class="card">
            <h2>1. Área Interactiva de Mouse</h2>
            <p class="desc">Haz clic, doble clic, clic derecho o mueve el cursor dentro de este panel.</p>
            <div id="mousePad" class="mouse-pad" tabindex="0">
                <span id="coordsText">Mueve el cursor aquí (X: 0, Y: 0)</span>
            </div>
            <div class="btn-row">
                <button type="button" id="btnClearLog" class="btn">Limpiar Registro</button>
            </div>
        </section>

        <section class="card">
            <h2>2. Registro de Eventos</h2>
            <div id="mouseLog" class="terminal" aria-live="polite"></div>
        </section>
    </main>

    <script src="main.js"></script>
</body>
</html>
