<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>⚡ Apuntes Completos de JavaScript Mid | Curso Desarrollo Web</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <script src="docs-data.js"></script>
    <style>
        :root { --bg:#070a13; --card:rgba(16,24,42,0.85); --border:rgba(255,255,255,0.1); --primary:#38bdf8; --indigo:#818cf8; --text:#f1f5f9; --muted:#94a3b8; --sans:'Outfit',system-ui,sans-serif; --mono:'Fira Code',monospace; }
        * { box-sizing:border-box; margin:0; padding:0; }
        body { background:var(--bg); color:var(--text); font-family:var(--sans); min-height:100vh; display:flex; flex-direction:column; }
        .topbar { position:sticky; top:0; z-index:40; background:rgba(7,10,19,0.92); backdrop-filter:blur(14px); border-bottom:1px solid var(--border); padding:12px 24px; display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap; }
        .brand { display:flex; align-items:center; gap:12px; }
        .badge { font-family:var(--mono); font-size:0.72rem; font-weight:600; color:var(--primary); background:rgba(56,189,248,0.12); border:1px solid rgba(56,189,248,0.35); padding:4px 10px; border-radius:999px; }
        .title { font-weight:700; font-size:1.05rem; }
        .btn { background:rgba(255,255,255,0.06); color:var(--text); border:1px solid var(--border); border-radius:10px; padding:7px 14px; font-family:var(--sans); font-size:0.85rem; font-weight:600; text-decoration:none; cursor:pointer; }
        .btn:hover { border-color:var(--primary); background:rgba(56,189,248,0.14); }
        .layout { max-width:1420px; width:100%; margin:0 auto; display:grid; grid-template-columns:270px 1fr 240px; gap:20px; padding:22px; flex:1; }
        .sidebar, .toc { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:16px; height:fit-content; position:sticky; top:80px; max-height:calc(100vh - 100px); overflow-y:auto; }
        .search-box { width:100%; background:#060913; color:var(--text); border:1px solid var(--border); border-radius:10px; padding:9px 12px; font-family:var(--sans); font-size:0.88rem; margin-bottom:12px; outline:none; }
        .search-box:focus { border-color:var(--primary); }
        .doc-list { display:flex; flex-direction:column; gap:6px; }
        .doc-item { display:flex; flex-direction:column; gap:2px; background:transparent; border:1px solid transparent; border-radius:10px; padding:10px 12px; text-align:left; color:var(--text); font-family:var(--sans); cursor:pointer; }
        .doc-item:hover { background:rgba(255,255,255,0.04); border-color:var(--border); }
        .doc-item.active { background:rgba(56,189,248,0.14); border-color:var(--primary); }
        .doc-item strong { font-size:0.9rem; }
        .doc-item span { font-size:0.74rem; color:var(--muted); font-family:var(--mono); }
        .toc-title { font-size:0.78rem; font-family:var(--mono); color:var(--primary); text-transform:uppercase; letter-spacing:0.06em; margin-bottom:10px; }
        .toc-list { display:flex; flex-direction:column; gap:6px; }
        .toc-link { color:var(--muted); text-decoration:none; font-size:0.82rem; line-height:1.35; }
        .toc-link:hover { color:var(--primary); }
        .toc-link.lvl-3 { padding-left:12px; font-size:0.78rem; }
        .reader { background:var(--card); border:1px solid var(--border); border-radius:18px; padding:28px 34px; min-width:0; }
        .reader-head { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px; padding-bottom:16px; margin-bottom:22px; border-bottom:1px solid var(--border); }
        .reader-head h1 { font-size:1.7rem; font-weight:800; color:#fff; }
        .md-body { line-height:1.74; color:#cbd5e1; font-size:0.98rem; }
        .md-body h1, .md-body h2, .md-body h3 { color:#fff; margin:1.4em 0 0.6em; line-height:1.3; scroll-margin-top:84px; }
        .md-body h2 { font-size:1.38rem; color:var(--primary); border-bottom:1px solid var(--border); padding-bottom:6px; }
        .md-body p { margin-bottom:0.95em; }
        .md-body ul, .md-body ol { padding-left:22px; margin-bottom:1em; }
        .md-body code { font-family:var(--mono); font-size:0.84em; background:rgba(56,189,248,0.12); color:#38bdf8; padding:2px 6px; border-radius:5px; }
        .code-wrap { position:relative; margin:14px 0; }
        .copy-btn { position:absolute; top:8px; right:8px; background:rgba(255,255,255,0.08); color:#cbd5e1; border:1px solid var(--border); border-radius:6px; padding:4px 10px; font-family:var(--mono); font-size:0.72rem; cursor:pointer; }
        .copy-btn:hover { background:var(--primary); color:#070a13; }
        .md-body pre { background:#050811; border:1px solid var(--border); border-radius:12px; padding:16px; overflow-x:auto; }
        .md-body pre code { background:none; color:#34d399; padding:0; font-size:0.85rem; }
        .md-body blockquote { border-left:4px solid var(--indigo); background:rgba(129,140,248,0.08); padding:10px 16px; border-radius:0 10px 10px 0; margin:12px 0; }
        /* Separador horizontal dentro del documento Markdown */
        .md-body hr { border:none; border-top:1px solid var(--border); margin:20px 0; }
        /* Tabla Markdown con ancho completo y bordes colapsados */
        .md-body table { width:100%; border-collapse:collapse; margin:16px 0; font-size:0.9rem; }
        /* Celdas de encabezado y cuerpo de tabla */
        .md-body th, .md-body td { border:1px solid var(--border); padding:9px 12px; text-align:left; }
        /* Estilo destacado para los encabezados de tabla */
        .md-body th { background:rgba(56,189,248,0.12); color:#fff; font-weight:700; }
        @media (max-width:1120px) { .layout { grid-template-columns:260px 1fr; } .toc { display:none; } }
        @media (max-width:820px) { .layout { grid-template-columns:1fr; } .sidebar { position:static; max-height:none; } }
    </style>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20viewBox%3D'0%200%2064%2064'%3E%3Crect%20width%3D'64'%20height%3D'64'%20rx%3D'14'%20fill%3D'%230b1120'%20stroke%3D'%233b82f6'%20stroke-width%3D'4'%2F%3E%3Ctext%20x%3D'50%25'%20y%3D'54%25'%20dominant-baseline%3D'middle'%20text-anchor%3D'middle'%20font-size%3D'36'%3E%F0%9F%93%98%3C%2Ftext%3E%3C%2Fsvg%3E" />
</head>
<body>
    <header class="topbar">
        <div class="brand"><span class="badge">JS MID · DOCUMENTACIÓN</span><span class="title">⚡ Apuntes Completos de JavaScript Mid</span></div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;"><a class="btn" href="../../../index.html?filter=proyectos">🚀 Proyectos</a><a class="btn" href="../../../index.html">🏠 Portal Principal</a></div>
    </header>
    <div class="layout">
        <aside class="sidebar"><input type="search" id="docSearch" class="search-box" placeholder="Buscar en apuntes..." /><div class="doc-list" id="docList"></div></aside>
        <main class="reader"><div class="reader-head"><h1 id="docTitle">Selecciona un apunte</h1><a id="moduleBtn" class="btn" href="../Window/index.html">🎯 Ir al Módulo</a></div><div id="docContent" class="md-body"></div></main>
        <aside class="toc"><div class="toc-title">📑 Índice</div><div class="toc-list" id="tocList"></div></aside>
    </div>
    <script>
        const DOCS = [{"file": "WINDOW.md", "title": "01. Objeto Window", "module": "../Window/index.html"}, {"file": "OBJETOS BARPROP.md", "title": "02. Objetos Barprop", "module": "../Objetos Barprop/index.html"}, {"file": "LOCATION.md", "title": "03. Objeto Location", "module": "../Location/index.html"}, {"file": "SCREEN Y SCROLL.md", "title": "04. Screen y Scroll", "module": "../Screen y Scroll/index.html"}, {"file": "RESIZE Y MOVE.md", "title": "05. Resize y Move", "module": "../Resize y Move/index.html"}, {"file": "EVENTOS.md", "title": "06. Eventos del DOM", "module": "../Eventos/index.html"}, {"file": "CONTROL DE FLUJO.md", "title": "07. Control de Flujo", "module": "../Switch/index.html"}, {"file": "SWITCH.md", "title": "08. Sentencia Switch", "module": "../Switch/index.html"}, {"file": "EXCEPCIONES.md", "title": "09. Excepciones", "module": "../Try-Catch/index.html"}, {"file": "TRY-CATCH.md", "title": "10. Try-Catch", "module": "../Try-Catch/index.html"}, {"file": "CALLBACKS.md", "title": "11. Callbacks", "module": "../Callbacks/index.html"}, {"file": "PROMESAS.md", "title": "12. Promesas", "module": "../Promesas/index.html"}, {"file": "ASYNC Y AWAIT.md", "title": "13. Async y Await", "module": "../Async y Await/index.html"}, {"file": "DATOS ESTRUCTURADOS (JSON).md", "title": "14. Datos Estructurados (JSON)", "module": "../Datos Estructurados (JSON)/index.html"}, {"file": "PETICIONES HTTP.md", "title": "15. Peticiones HTTP", "module": "../Peticiones HTTP/index.html"}, {"file": "AJAX.md", "title": "16. AJAX (XMLHttpRequest)", "module": "../Ajax/index.html"}, {"file": "FETCH.md", "title": "17. Fetch API", "module": "../Fetch/index.html"}, {"file": "AXIOS.md", "title": "18. Librería Axios", "module": "../Libreria Axios/index.html"}, {"file": "CODIGO OBSOLETO.md", "title": "19. Código Obsoleto", "module": "../Codigo Obsoleto/index.html"}, {"file": "PESTAÑA ELEMENTS.md", "title": "20. DevTools: Elements", "module": "../Pestañas DevTools/index.html"}, {"file": "PESTAÑA CONSOLA.md", "title": "21. DevTools: Consola", "module": "../Pestañas DevTools/index.html"}, {"file": "PESTAÑA SOURCES.md", "title": "22. DevTools: Sources", "module": "../Pestañas DevTools/index.html"}, {"file": "PESTAÑA NETWORK.md", "title": "23. DevTools: Network", "module": "../Pestañas DevTools/index.html"}, {"file": "PESTAÑA TIMELINE.md", "title": "24. DevTools: Timeline", "module": "../Pestañas DevTools/index.html"}, {"file": "PESTAÑA APPLICATION.md", "title": "25. DevTools: Application", "module": "../Pestañas DevTools/index.html"}];
        const docList = document.getElementById('docList'), docSearch = document.getElementById('docSearch'), docTitle = document.getElementById('docTitle'), docContent = document.getElementById('docContent'), tocList = document.getElementById('tocList'), moduleBtn = document.getElementById('moduleBtn');
        let activeFile = DOCS[0].file;
        const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        const fmt = t => esc(t).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/\*([^*]+)\*/g,'<em>$1</em>');
        function renderMd(md) {
            const lines = md.replace(/\r\n/g,'\n').split('\n');
            let html='', inCode=false, inList=false, tableRows=[], hIdx=0, toc=[];
            // Convierte las filas acumuladas de una tabla Markdown en HTML <table>
            const flushTable = () => {
                if (!tableRows.length) return; // No hace nada si no hay filas pendientes
                const parseRow = r => r.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map(c => c.trim()); // Extrae celdas
                const headers = parseRow(tableRows[0]); // Primera fila como encabezados
                const body = tableRows.slice(2); // Omite la fila separadora (---)
                html += '<table><thead><tr>' + headers.map(h => `<th>${fmt(h)}</th>`).join('') + '</tr></thead><tbody>'; // Encabezado
                body.forEach(r => { html += '<tr>' + parseRow(r).map(c => `<td>${fmt(c)}</td>`).join('') + '</tr>'; }); // Filas de datos
                html += '</tbody></table>'; // Cierre de tabla
                tableRows = []; // Reinicia el acumulador
            };
            for (const line of lines) {
                if (line.trim().startsWith('```')) {
                    if (inList) { html+='</ul>'; inList=false; }
                    flushTable();
                    html += inCode ? '</code></pre></div>' : '<div class="code-wrap"><button class="copy-btn">Copiar</button><pre><code>';
                    inCode = !inCode; continue;
                }
                if (inCode) { html += esc(line) + '\n'; continue; }
                const tr = line.trim();
                if (/^\|.*\|$/.test(tr)) {
                    if (inList) { html+='</ul>'; inList=false; }
                    tableRows.push(tr); continue;
                }
                flushTable();
                if (!tr) { if (inList) { html+='</ul>'; inList=false; } continue; }
                if (/^---+$/.test(tr)) {
                    if (inList) { html+='</ul>'; inList=false; }
                    html += '<hr>'; continue;
                }
                if (/^#{1,3}\s+/.test(tr)) {
                    if (inList) { html+='</ul>'; inList=false; }
                    const lvl = tr.match(/^(#{1,3})/)[1].length, raw = tr.replace(/^#{1,3}\s+/,''), id = 's-'+(++hIdx);
                    if (lvl >= 1 && hIdx > 1) toc.push({id,lvl,text:raw.replace(/`/g,'')});
                    html += `<h${lvl} id="${id}">${fmt(raw)}</h${lvl}>`;
                } else if (/^[-*]\s+/.test(tr)) {
                    if (!inList) { html+='<ul>'; inList=true; }
                    html += `<li>${fmt(tr.replace(/^[-*]\s+/,''))}</li>`;
                } else if (tr.startsWith('>')) {
                    if (inList) { html+='</ul>'; inList=false; }
                    html += `<blockquote>${fmt(tr.replace(/^>\s*/,''))}</blockquote>`;
                } else {
                    if (inList) { html+='</ul>'; inList=false; }
                    html += `<p>${fmt(tr)}</p>`;
                }
            }
            flushTable();
            if (inList) html += '</ul>';
            if (inCode) html += '</code></pre></div>';
            return {html, toc};
        }
        function loadDoc(doc) {
            activeFile = doc.file; docTitle.textContent = doc.title; if (moduleBtn && doc.module) moduleBtn.href = encodeURI(doc.module);
            renderSidebar(docSearch.value);
            const md = (window.DOCS_CONTENT && window.DOCS_CONTENT[doc.file]) || '';
            const {html, toc} = renderMd(md);
            docContent.innerHTML = html;
            tocList.innerHTML = toc.map(t => `<a class="toc-link lvl-${t.lvl}" href="#${t.id}">${esc(t.text)}</a>`).join('');
            docContent.querySelectorAll('.copy-btn').forEach(b => b.addEventListener('click', () => {
                navigator.clipboard?.writeText(b.nextElementSibling?.textContent || '');
                b.textContent = '¡Copiado!'; setTimeout(() => b.textContent = 'Copiar', 1400);
            }));
        }
        function renderSidebar(q='') {
            const term = q.trim().toLowerCase(); docList.innerHTML = '';
            DOCS.filter(d => !term || d.title.toLowerCase().includes(term) || ((window.DOCS_CONTENT&&window.DOCS_CONTENT[d.file])||'').toLowerCase().includes(term))
                .forEach(doc => {
                    const b = document.createElement('button');
                    b.className = 'doc-item' + (doc.file === activeFile ? ' active' : '');
                    b.innerHTML = `<strong>${doc.title}</strong><span>${doc.file}</span>`;
                    b.addEventListener('click', () => loadDoc(doc));
                    docList.appendChild(b);
                });
        }
        docSearch.addEventListener('input', () => renderSidebar(docSearch.value));
        loadDoc(DOCS[0]);
    </script>
</body>
</html>
