<!DOCTYPE html>
<html lang="es">
<head>
    <!-- Codificación UTF-8 para soportar tildes, ñ y emojis -->
    <meta charset="UTF-8">
    <!-- Ajuste responsivo al ancho real del dispositivo -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD con IndexedDB | Master Level</title>
    <!-- Google Fonts: Tipografía moderna Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Hoja de estilos vinculada -->
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="../../../../RESOURCES COURSE/exercises/ejercicios-neon.css">
    <script src="../../../../RESOURCES COURSE/exercises/ejercicios-neon.js" defer></script>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20viewBox%3D'0%200%2064%2064'%3E%3Crect%20width%3D'64'%20height%3D'64'%20rx%3D'14'%20fill%3D'%230b1120'%20stroke%3D'%23a855f7'%20stroke-width%3D'4'%2F%3E%3Ctext%20x%3D'50%25'%20y%3D'54%25'%20dominant-baseline%3D'middle'%20text-anchor%3D'middle'%20font-size%3D'36'%3E%F0%9F%97%84%EF%B8%8F%3C%2Ftext%3E%3C%2Fsvg%3E" />
</head>
<body>
    <!-- Luces ambientales de fondo estilo Glassmorphism -->
    <div class="bg-glow glow-1"></div>
    <div class="bg-glow glow-2"></div>

    <!-- Contenedor principal centrado -->
    <div class="contenedor-app">
        <!-- Encabezado con título del ejercicio -->
        <header class="encabezado">
            <span class="badge-modulo">JAVASCRIPT MASTER LEVEL</span>
            <h1>🗄️ Gestor de Nombres</h1>
            <p>Almacenamiento persistente con IndexedDB</p>
        </header>

        <!-- Sección para agregar nuevos nombres -->
        <div class="add-nombres">
            <input type="text" id="name" placeholder="Introduce un nombre..." autocomplete="off">
            <button id="add">Añadir</button>
        </div>

        <!-- Contenedor donde se listan los nombres almacenados -->
        <div class="nombres">
            <!-- Los elementos se cargan dinámicamente desde main.js -->
        </div>
    </div>

    <!-- Script con la lógica de IndexedDB -->
    <script src="main.js"></script>
</body>
</html>
