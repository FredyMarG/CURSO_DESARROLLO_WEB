<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Web Paint (Canvas 2D) | Master Level</title>
    <!-- Google Fonts: Outfit para textos y Fira Code para coordenadas -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <!-- Hoja de estilos del ejercicio y tema neón compartido -->
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="../../../../RESOURCES COURSE/ejercicios-neon.css" />
    <script src="../../../../RESOURCES COURSE/ejercicios-neon.js" defer></script>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20viewBox%3D'0%200%2064%2064'%3E%3Crect%20width%3D'64'%20height%3D'64'%20rx%3D'14'%20fill%3D'%230b1120'%20stroke%3D'%2300f0ff'%20stroke-width%3D'4'%2F%3E%3Ctext%20x%3D'50%25'%20y%3D'54%25'%20dominant-baseline%3D'middle'%20text-anchor%3D'middle'%20font-size%3D'36'%3E%F0%9F%8E%A8%3C%2Ftext%3E%3C%2Fsvg%3E" />
</head>
<body>
    <!-- Luces ambientales de fondo estilo Glassmorphism -->
    <div class="bg-glow glow-1"></div>
    <div class="bg-glow glow-2"></div>

    <!-- Contenedor principal centrado -->
    <main class="contenedor-app">
        <!-- Encabezado estándar de los ejercicios -->
        <header class="encabezado">
            <span class="badge-modulo">JAVASCRIPT MASTER LEVEL</span>
            <h1>🎨 Web Paint — Pizarra Canvas 2D</h1>
            <p>Dibuja en tiempo real sobre HTML5 Canvas con selector de color, grosor, borrador, historial Deshacer y descarga en PNG</p>
        </header>

        <!-- Editor de dibujo interactivo -->
        <section class="editor">
            <!-- Barra de herramientas superior -->
            <div class="paint-toolbar">
                <label class="control-item">
                    <span>Color</span>
                    <input type="color" id="color" value="#00f0ff" title="Seleccionar color del pincel" />
                </label>

                <label class="control-item control-range">
                    <span>Grosor: <strong id="lwVal">4px</strong></span>
                    <input type="range" min="1" max="24" value="4" id="lw" title="Ajustar grosor del trazo" />
                </label>

                <div class="toolbar-actions">
                    <button type="button" class="paint-btn active" id="btnBrush">✏️ Pincel</button>
                    <button type="button" class="paint-btn" id="btnEraser">🧽 Borrador</button>
                    <button type="button" class="paint-btn" id="btnUndo" title="Deshacer (Ctrl+Z)">↩️ Deshacer</button>
                    <button type="button" class="paint-btn" id="btnClear">🧹 Limpiar</button>
                    <button type="button" class="paint-btn primary" id="btnDownload">💾 Descargar PNG</button>
                </div>
            </div>

            <!-- Lienzo principal de dibujo -->
            <div class="canvas-stage">
                <canvas id="canvas" width="760" height="440"></canvas>
            </div>

            <!-- Barra inferior de estado en vivo -->
            <div class="paint-status">
                <span id="paintCoords">Cursor: (x: 0, y: 0)</span>
                <span id="paintMode">Modo: Pincel · Ctrl+Z para deshacer</span>
            </div>
        </section>
    </main>

    <!-- Lógica JavaScript del ejercicio -->
    <script src="main.js"></script>
</body>
</html>
