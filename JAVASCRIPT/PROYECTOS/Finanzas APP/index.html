<!DOCTYPE html>
<html lang="es">
<head>
    <!-- Codificación UTF-8 para soportar tildes, ñ y emojis -->
    <meta charset="UTF-8" />
    <!-- Ajuste responsivo al ancho real del dispositivo -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Finanzas APP | Proyecto JavaScript</title>
    <!-- Google Fonts: Outfit para textos y Fira Code para cifras -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <!-- Hoja de estilos del proyecto y tema neón compartido del curso -->
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="../../../RESOURCES COURSE/exercises/ejercicios-neon.css" />
    <script src="../../../RESOURCES COURSE/exercises/ejercicios-neon.js" defer></script>
    <!-- Favicon SVG personalizado acorde al proyecto -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20viewBox%3D'0%200%2064%2064'%3E%3Crect%20width%3D'64'%20height%3D'64'%20rx%3D'14'%20fill%3D'%230b1120'%20stroke%3D'%2300f0ff'%20stroke-width%3D'4'%2F%3E%3Ctext%20x%3D'50%25'%20y%3D'54%25'%20dominant-baseline%3D'middle'%20text-anchor%3D'middle'%20font-size%3D'36'%3E%F0%9F%92%B0%3C%2Ftext%3E%3C%2Fsvg%3E" />
</head>
<body>
    <!-- Luces ambientales de fondo estilo Glassmorphism -->
    <div class="bg-glow glow-1"></div>
    <div class="bg-glow glow-2"></div>

    <!-- Contenedor principal centrado -->
    <div class="container">
        <!-- Encabezado estándar de los proyectos del curso -->
        <header class="encabezado">
            <span class="badge-modulo">JAVASCRIPT PROYECTOS</span>
            <h1>💰 Control de Finanzas</h1>
        </header>

        <!-- Tarjetas de resumen en tiempo real -->
        <div class="resumen">
            <div>Balance: <span id="balance">$0</span></div>
            <div>Ingresos: <span id="ingresos">$0</span></div>
            <div>Gastos: <span id="gastos">$0</span></div>
        </div>

        <!-- Gráfico de dona en Canvas con su leyenda -->
        <div class="grafico-card">
            <canvas id="grafico-resumen" width="180" height="180"></canvas>
            <div class="leyenda-grafico">
                <div class="leyenda-item">
                    <span class="punto-color punto-ingresos"></span>
                    <span>Ingresos: <strong id="porcentaje-ingresos">0%</strong></span>
                </div>
                <div class="leyenda-item">
                    <span class="punto-color punto-gastos"></span>
                    <span>Gastos: <strong id="porcentaje-gastos">0%</strong></span>
                </div>
            </div>
        </div>

        <!-- Formulario para registrar ingresos y gastos -->
        <form id="form-transaccion">
            <input type="text" id="concepto" placeholder="Ingrese su concepto o gasto" required />
            <input type="text" id="monto" inputmode="numeric" placeholder="Monto (ej: 50.000)" required />
            <select id="tipo">
                <option value="ingreso">Ingreso</option>
                <option value="gasto">Gasto</option>
            </select>
            <button type="submit">Agregar</button>
        </form>

        <!-- Filtros rápidos para visualizar todos, solo ingresos o solo gastos -->
        <div class="filtros-lista" id="filtros-lista">
            <button type="button" class="filtro-btn activo" data-filtro="todos">Todos</button>
            <button type="button" class="filtro-btn" data-filtro="ingreso">Ingresos</button>
            <button type="button" class="filtro-btn" data-filtro="gasto">Gastos</button>
        </div>

        <!-- Lista dinámica de movimientos -->
        <ul id="lista"></ul>
    </div>

    <!-- Lógica JavaScript del proyecto -->
    <script src="app.js"></script>
</body>
</html>
