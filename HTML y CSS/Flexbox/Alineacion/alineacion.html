<!DOCTYPE html>
<html lang="es">
<head>
    <!-- 
        PROYECTO: Guía de Alineación Flexbox
        OBJETIVO: Demostrar las propiedades de alineación en contenedores flexibles.
    -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mastering Flexbox - Alineación</title>
    
    <!-- Estilos principales del ejercicio -->
    <link rel="stylesheet" href="alineacion.css">
</head>
<body>

    <header>
        <h1>Visualización de Alineación Flexbox</h1>
    </header>

    <main>
        <!-- 
            CONTENEDOR PADRE (Flex Container)
            Aquí se aplican propiedades como justify-content y align-items.
        -->
        <div class="flexbox" aria-label="Contenedor de demostración flexbox">
            <!-- HIJOS DIRECTOS (Flex Items) -->
            <div class="flex-item">1</div>
            <div class="flex-item">2</div>
            <div class="flex-item">3</div>
            <div class="flex-item">4</div>
            <div class="flex-item">5</div>
            <div class="flex-item">6</div>
            <div class="flex-item">7</div>
            <div class="flex-item">8</div>
            <div class="flex-item">9</div>
        </div>
    </main>

</body>
</html>
