<!doctype html>
<html lang="es">
<head>
    <!-- Codificación UTF-8 para soportar acentos, ñ y emojis -->
    <meta charset="UTF-8" />
    <!-- Ajuste responsivo al ancho real de la pantalla -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Documentación Completa HTML5 y CSS3 | Curso Desarrollo Web</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <script src="docs-data.js"></script>
    <style>
        :root {
            --bg: #070a13;
            --surface: #0e1526;
            --card: rgba(16, 24, 42, 0.85);
            --border: rgba(255, 255, 255, 0.1);
            --primary: #38bdf8;
            --indigo: #818cf8;
            --emerald: #10b981;
            --text: #f1f5f9;
            --muted: #94a3b8;
            --sans: 'Outfit', system-ui, sans-serif;
            --mono: 'Fira Code', monospace;
        }
        /* Barras de desplazamiento personalizadas acordes al lector oscuro */
        * { scrollbar-width: thin; scrollbar-color: rgba(56, 189, 248, 0.45) #070a13; }
        ::-webkit-scrollbar { width: 10px; height: 10px; }
        ::-webkit-scrollbar-track { background: #070a13; }
        ::-webkit-scrollbar-thumb { background: rgba(56, 189, 248, 0.45); border-radius: 999px; border: 2px solid #070a13; }
        ::-webkit-scrollbar-thumb:hover { background: var(--primary); }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: var(--bg); color: var(--text); font-family: var(--sans); min-height: 100vh; display: flex; flex-direction: column; }
        .topbar {
            position: sticky; top: 0; z-index: 40;
            background: rgba(7, 10, 19, 0.92); backdrop-filter: blur(14px);
            border-bottom: 1px solid var(--border); padding: 12px 24px;
            display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap;
        }
        .brand { display: flex; align-items: center; gap: 12px; }
        .badge {
            font-family: var(--mono); font-size: 0.72rem; font-weight: 600;
            color: var(--primary); background: rgba(56, 189, 248, 0.12);
            border: 1px solid rgba(56, 189, 248, 0.35); padding: 4px 10px; border-radius: 999px;
        }
        .title { font-weight: 700; font-size: 1.05rem; }
        .actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        .btn {
            background: rgba(255,255,255,0.06); color: var(--text);
            border: 1px solid var(--border); border-radius: 10px;
            padding: 7px 14px; font-family: var(--sans); font-size: 0.85rem; font-weight: 600;
            text-decoration: none; cursor: pointer; transition: all 0.2s;
        }
        .btn:hover { border-color: var(--primary); background: rgba(56, 189, 248, 0.14); }
        .layout {
            max-width: 1420px; width: 100%; margin: 0 auto;
            display: grid; grid-template-columns: 270px 1fr 240px; gap: 20px;
            padding: 22px; flex: 1;
        }
        .sidebar, .toc {
            background: var(--card); border: 1px solid var(--border);
            border-radius: 16px; padding: 16px; height: fit-content;
            position: sticky; top: 80px; max-height: calc(100vh - 100px); overflow-y: auto;
        }
        .search-box {
            width: 100%; background: #060913; color: var(--text);
            border: 1px solid var(--border); border-radius: 10px;
            padding: 9px 12px; font-family: var(--sans); font-size: 0.88rem;
            margin-bottom: 12px; outline: none;
        }
        .search-box:focus { border-color: var(--primary); }
        .doc-list { display: flex; flex-direction: column; gap: 6px; }
        .doc-item {
            display: flex; flex-direction: column; gap: 2px;
            background: transparent; border: 1px solid transparent;
            border-radius: 10px; padding: 10px 12px; text-align: left;
            color: var(--text); font-family: var(--sans); cursor: pointer; transition: all 0.2s;
        }
        .doc-item:hover { background: rgba(255,255,255,0.04); border-color: var(--border); }
        .doc-item.active { background: rgba(56, 189, 248, 0.14); border-color: var(--primary); }
        .doc-item strong { font-size: 0.9rem; }
        .doc-item span { font-size: 0.74rem; color: var(--muted); font-family: var(--mono); }

        .toc-title { font-size: 0.78rem; font-family: var(--mono); color: var(--primary); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 10px; }
        .toc-list { display: flex; flex-direction: column; gap: 6px; }
        .toc-link { color: var(--muted); text-decoration: none; font-size: 0.82rem; line-height: 1.35; transition: color 0.15s; }
        .toc-link:hover { color: var(--primary); }
        .toc-link.lvl-3 { padding-left: 12px; font-size: 0.78rem; }

        .reader {
            background: var(--card); border: 1px solid var(--border);
            border-radius: 18px; padding: 28px 34px; min-width: 0;
        }
        .reader-head {
            display: flex; justify-content: space-between; align-items: center;
            flex-wrap: wrap; gap: 12px; padding-bottom: 16px; margin-bottom: 22px;
            border-bottom: 1px solid var(--border);
        }
        .reader-head h1 { font-size: 1.75rem; font-weight: 800; color: #fff; }
        .md-body { line-height: 1.74; color: #cbd5e1; font-size: 0.98rem; }
        .md-body h1, .md-body h2, .md-body h3 { color: #fff; margin: 1.4em 0 0.6em; line-height: 1.3; scroll-margin-top: 84px; }
        .md-body h2 { font-size: 1.38rem; color: var(--primary); border-bottom: 1px solid var(--border); padding-bottom: 6px; }
        .md-body h3 { font-size: 1.12rem; color: #e2e8f0; }
        .md-body p { margin-bottom: 0.95em; }
        .md-body ul, .md-body ol { padding-left: 22px; margin-bottom: 1em; }
        .md-body li { margin-bottom: 0.35em; }
        .md-body code {
            font-family: var(--mono); font-size: 0.84em;
            background: rgba(56, 189, 248, 0.12); color: #38bdf8;
            padding: 2px 6px; border-radius: 5px;
        }
        .code-wrap { position: relative; margin: 14px 0; }
        .copy-btn {
            position: absolute; top: 8px; right: 8px;
            background: rgba(255,255,255,0.08); color: #cbd5e1;
            border: 1px solid var(--border); border-radius: 6px;
            padding: 4px 10px; font-family: var(--mono); font-size: 0.72rem; cursor: pointer;
        }
        .copy-btn:hover { background: var(--primary); color: #070a13; }
        .md-body pre {
            background: #050811; border: 1px solid var(--border);
            border-radius: 12px; padding: 16px; overflow-x: auto;
        }
        .md-body pre code { background: none; color: #34d399; padding: 0; font-size: 0.85rem; }
        .md-body blockquote {
            border-left: 4px solid var(--indigo); background: rgba(129, 140, 248, 0.08);
            padding: 10px 16px; border-radius: 0 10px 10px 0; margin: 12px 0;
        }
        .md-body table { width: 100%; border-collapse: collapse; margin: 14px 0; font-size: 0.88rem; }
        .md-body th, .md-body td { border: 1px solid var(--border); padding: 8px 12px; text-align: left; }
        .md-body th { background: rgba(56, 189, 248, 0.1); color: var(--primary); }
        .md-body hr { border: none; border-top: 1px solid var(--border); margin: 20px 0; }
        @media (max-width: 1120px) {
            .layout { grid-template-columns: 260px 1fr; }
            .toc { display: none; }
        }
        @media (max-width: 820px) {
            .layout { grid-template-columns: 1fr; }
            .sidebar { position: static; max-height: none; }
            .reader { padding: 20px; }
        }
    </style>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20viewBox%3D'0%200%2064%2064'%3E%3Crect%20width%3D'64'%20height%3D'64'%20rx%3D'14'%20fill%3D'%230b1120'%20stroke%3D'%233b82f6'%20stroke-width%3D'4'%2F%3E%3Ctext%20x%3D'50%25'%20y%3D'54%25'%20dominant-baseline%3D'middle'%20text-anchor%3D'middle'%20font-size%3D'36'%3E%F0%9F%93%98%3C%2Ftext%3E%3C%2Fsvg%3E" />
    <!-- Selector rápido entre los 5 centros de documentación del curso -->
    <script src="../../RESOURCES COURSE/plantilla/docs-switcher.js" defer></script>
</head>
<body>
    <header class="topbar">
        <div class="brand">
            <span class="badge">DOCUMENTACIÓN · HTML5 Y CSS3</span>
            <span class="title">📘 Apuntes Completos de HTML5 y CSS3</span>
        </div>
        <div class="actions">
            <a class="btn" href="../index.html">🎨 Mega-Portal HTML/CSS</a>
            <a class="btn" href="../PROYECTOS/index.html">🚀 Proyectos</a>
            <a class="btn" href="../../index.html">🏠 Portal Principal</a>
        </div>
    </header>

    <div class="layout">
        <aside class="sidebar">
            <input type="search" id="docSearch" class="search-box" placeholder="Buscar en todos los apuntes..." />
            <div class="doc-list" id="docList"></div>
        </aside>

        <main class="reader">
            <div class="reader-head">
                <h1 id="docTitle">Selecciona un apunte</h1>
                <a id="moduleBtn" class="btn" href="../HTML BASICO/index.html">🎯 Ir al Módulo</a>
            </div>
            <div id="docContent" class="md-body">Cargando documentación...</div>
        </main>

        <aside class="toc">
            <div class="toc-title">📑 Índice</div>
            <div class="toc-list" id="tocList"></div>
        </aside>
    </div>

    <script>
        const DOCS = [
            { file: 'HTML.md', title: '01. HTML5 Completo', desc: 'Qué es HTML5, para qué sirve, etiquetas, semántica y formularios', module: '../HTML BASICO/index.html' },
            { file: 'CSS.md', title: '02. CSS3 Completo', desc: 'Qué es CSS3, para qué sirve, selectores, box model y CSS moderno', module: '../CSS BASICO/index.html' },
            { file: 'FLEXBOX.md', title: '03. Flexbox', desc: 'Ejes, alineación, flex-grow, shrink y layouts 1D', module: '../Flexbox/index.html' },
            { file: 'GRID.md', title: '04. CSS Grid', desc: 'Filas, columnas, fr, repeat(), áreas y layouts 2D', module: '../Grid/index.html' },
            { file: 'ANIMACIONES.md', title: '05. Animaciones y Transiciones', desc: 'Keyframes, cubic-bezier, 60 FPS y scroll animations', module: '../Animaciones/index.html' },
            { file: 'FUNCIONES_AVANZADAS.md', title: '06. Funciones Avanzadas', desc: 'Variables CSS, calc(), clamp(), min(), max() y :has()', module: '../Funciones Avanzadas/index.html' },
            { file: 'RESPONSIVE.md', title: '07. Responsive Design', desc: 'Mobile-first, media queries, container queries y srcset', module: '../Responsive Design/index.html' },
            { file: 'HOSTING.md', title: '08. Hosting y Despliegue', desc: 'Dominios, DNS, GitHub Pages, Netlify y buenas prácticas', module: '../index.html' }
        ];

        const docList = document.getElementById('docList');
        const docSearch = document.getElementById('docSearch');
        const docTitle = document.getElementById('docTitle');
        const docContent = document.getElementById('docContent');
        const tocList = document.getElementById('tocList');
        const moduleBtn = document.getElementById('moduleBtn');
        let activeFile = DOCS[0].file;

        function escapeHtml(str) {
            return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }

        function formatInline(text) {
            let s = escapeHtml(text);
            s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
            s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
            s = s.replace(/\*([^*]+)\*/g, '<em>$1</em>');
            return s;
        }

        function renderMarkdown(md) {
            const lines = md.replace(/\r\n/g, '\n').split('\n');
            let html = '';
            let inCode = false;
            let listTag = '';
            let inTable = false;
            let headingIdx = 0;
            const toc = [];
            const closeList = () => { if (listTag) { html += `</${listTag}>`; listTag = ''; } };
            const closeTable = () => { if (inTable) { html += '</tbody></table>'; inTable = false; } };

            for (let i = 0; i < lines.length; i++) {
                const line = lines[i];
                if (line.trim().startsWith('```')) {
                    closeList(); closeTable();
                    if (!inCode) {
                        inCode = true;
                        html += '<div class="code-wrap"><button class="copy-btn">Copiar</button><pre><code>';
                    } else {
                        inCode = false;
                        html += '</code></pre></div>';
                    }
                    continue;
                }
                if (inCode) {
                    html += escapeHtml(line) + '\n';
                    continue;
                }

                const trimmed = line.trim();
                if (!trimmed) {
                    closeList(); closeTable();
                    continue;
                }

                if (trimmed.startsWith('|') && trimmed.endsWith('|')) {
                    closeList();
                    const cells = trimmed.slice(1, -1).split('|').map(c => c.trim());
                    if (cells.every(c => /^:?-{2,}:?$/.test(c))) continue;
                    if (!inTable) {
                        inTable = true;
                        html += '<table><thead><tr>' + cells.map(c => `<th>${formatInline(c)}</th>`).join('') + '</tr></thead><tbody>';
                    } else {
                        html += '<tr>' + cells.map(c => `<td>${formatInline(c)}</td>`).join('') + '</tr>';
                    }
                    continue;
                }
                closeTable();

                if (/^---+$/.test(trimmed)) {
                    closeList();
                    html += '<hr>';
                } else if (/^#{1,3}\s+/.test(trimmed)) {
                    closeList();
                    const level = trimmed.match(/^(#{1,3})/)[1].length;
                    const rawText = trimmed.replace(/^#{1,3}\s+/, '');
                    const id = 'sec-' + (++headingIdx);
                    if (level >= 1 && headingIdx > 1) toc.push({ id, level, text: rawText.replace(/`/g, '') });
                    html += `<h${level} id="${id}">${formatInline(rawText)}</h${level}>`;
                } else if (/^[-*]\s+/.test(trimmed)) {
                    if (listTag !== 'ul') { closeList(); html += '<ul>'; listTag = 'ul'; }
                    html += `<li>${formatInline(trimmed.replace(/^[-*]\s+/, ''))}</li>`;
                } else if (/^\d+\.\s+/.test(trimmed)) {
                    if (listTag !== 'ol') { closeList(); html += '<ol>'; listTag = 'ol'; }
                    html += `<li>${formatInline(trimmed.replace(/^\d+\.\s+/, ''))}</li>`;
                } else if (trimmed.startsWith('>')) {
                    closeList();
                    html += `<blockquote>${formatInline(trimmed.replace(/^>\s*/, ''))}</blockquote>`;
                } else {
                    closeList();
                    html += `<p>${formatInline(trimmed)}</p>`;
                }
            }
            closeList(); closeTable();
            if (inCode) html += '</code></pre></div>';
            return { html, toc };
        }

        async function loadDoc(doc) {
            activeFile = doc.file;
            docTitle.textContent = doc.title;
            if (moduleBtn && doc.module) moduleBtn.href = encodeURI(doc.module);
            renderSidebar(docSearch.value);

            let mdText = (window.DOCS_CONTENT && window.DOCS_CONTENT[doc.file]) || '';
            if (mdText && typeof mdText === 'object' && mdText.value) mdText = mdText.value;
            if (!mdText) {
                try {
                    const res = await fetch('apuntes/' + doc.file);
                    if (res.ok) mdText = await res.text();
                } catch (_) {}
            }

            if (!mdText) {
                docContent.innerHTML = '<p style="color:#fda4af;">No se pudo cargar el documento.</p>';
                tocList.innerHTML = '';
                return;
            }

            const { html, toc } = renderMarkdown(mdText);
            docContent.innerHTML = html;

            tocList.innerHTML = toc.map(t =>
                `<a class="toc-link lvl-${t.level}" href="#${t.id}">${escapeHtml(t.text)}</a>`
            ).join('');

            docContent.querySelectorAll('.copy-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const code = btn.nextElementSibling?.textContent || '';
                    navigator.clipboard?.writeText(code);
                    btn.textContent = '¡Copiado!';
                    setTimeout(() => { btn.textContent = 'Copiar'; }, 1400);
                });
            });
        }

        function renderSidebar(filter = '') {
            const q = filter.trim().toLowerCase();
            docList.innerHTML = '';
            DOCS.filter(d => {
                if (!q) return true;
                const body = (window.DOCS_CONTENT && window.DOCS_CONTENT[d.file] || '').toLowerCase();
                return d.title.toLowerCase().includes(q) || d.desc.toLowerCase().includes(q) || body.includes(q);
            }).forEach(doc => {
                const btn = document.createElement('button');
                btn.className = 'doc-item' + (doc.file === activeFile ? ' active' : '');
                btn.innerHTML = `<strong>${doc.title}</strong><span>${doc.file}</span>`;
                btn.addEventListener('click', () => loadDoc(doc));
                docList.appendChild(btn);
            });
        }

        docSearch.addEventListener('input', () => renderSidebar(docSearch.value));
        loadDoc(DOCS[0]);
    </script>
</body>
</html>
