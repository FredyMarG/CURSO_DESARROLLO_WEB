<!DOCTYPE html>
<!-- CURSO_WEB_DOC_HTML v1
     Archivo: HTML y CSS/HTML Basico/Img.html
     Título: Imagenes
     Propósito: estructura semántica y contenido; el navegador interpreta estas etiquetas para mostrar la página.
     Relación: clases e IDs enlazan con archivos .css y .js de esta misma carpeta o rutas indicadas.
-->
<!-- CURSO_WEB_HTML_STRUCT v1 -->


<html lang="en">
<head>
<!-- Cabecera (head): metadatos, título y enlaces a CSS, JS o fuentes -->

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imagenes</title>
</head>
<body>
    <!-- Aquí comienza el contenido visible de la página. -->
<!-- Cuerpo (body): contenido visible en la ventana del navegador -->

    <!-- 
        Etiqueta <img>: Es un elemento 'empty' (no tiene etiqueta de cierre).
        
        ATRIBUTOS CRÍTICOS:
        - 'src': Fuente de la imagen. Puede ser una ruta local o una URL externa.
        - 'alt' (Texto Alternativo): 
            1. ACCESIBILIDAD: Leído por lectores de pantalla para personas con discapacidad visual.
            2. SEO: Ayuda a Google a entender de qué trata la imagen.
            3. FALLBACK: Aparece si la imagen falla al cargar.
    -->
    <img src="https://images.pexels.com/photos/13260076/pexels-photo-13260076.jpeg" alt="Descripción de la imagen">
</body>
<!-- Cierre del documento HTML -->
</html>
