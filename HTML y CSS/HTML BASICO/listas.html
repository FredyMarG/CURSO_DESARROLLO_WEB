<!DOCTYPE html>
<!-- CURSO_WEB_DOC_HTML v1
     Archivo: HTML y CSS/HTML Basico/Listas.html
     Título: Listas
     Propósito: estructura semántica y contenido; el navegador interpreta estas etiquetas para mostrar la página.
     Relación: clases e IDs enlazan con archivos .css y .js de esta misma carpeta o rutas indicadas.
-->
<!-- CURSO_WEB_HTML_STRUCT v1 -->


<html lang="en">
<head>
<!-- Cabecera (head): metadatos, título y enlaces a CSS, JS o fuentes -->

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listas</title>
</head>
<body>
    <!-- Aquí comienza el contenido visible de la página. -->
<!-- Cuerpo (body): contenido visible en la ventana del navegador -->

    <!-- 
        LISTA ORDENADA (<ol>):
        Se utiliza cuando el orden de los elementos es importante (ej. pasos de una receta o un ranking).
        El navegador añade la numeración automáticamente.
    -->
    <!-- Lista de elementos relacionados. -->
    <ol>
        <!-- Elemento individual dentro de la lista. -->
        <li>Elemento 1</li>
        <!-- Elemento individual dentro de la lista. -->
        <li>Elemento 2</li>
        <!-- Elemento individual dentro de la lista. -->
        <li>Elemento 3</li>
    </ol>

    <!-- 
        LISTA DESORDENADA (<ul>):
        Se utiliza cuando el orden NO importa. Es la base técnica para crear menús de navegación.
    -->
    <!-- Lista de elementos relacionados. -->
    <ul>
        <!-- Elemento individual dentro de la lista. -->
        <li>Elemento 1</li>
        <!-- Elemento individual dentro de la lista. -->
        <li>Elemento 2</li>
        <!-- Elemento individual dentro de la lista. -->
        <li>Elemento 3</li>
    </ul>
</body>
<!-- Cierre del documento HTML -->
</html>
