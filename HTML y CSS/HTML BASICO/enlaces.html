<!DOCTYPE html>
<!-- CURSO_WEB_DOC_HTML v1
     Archivo: HTML y CSS/HTML Basico/Enlaces.html
     Título: Enlaces o hipervinculos
     Propósito: estructura semántica y contenido; el navegador interpreta estas etiquetas para mostrar la página.
     Relación: clases e IDs enlazan con archivos .css y .js de esta misma carpeta o rutas indicadas.
-->
<!-- CURSO_WEB_HTML_STRUCT v1 -->


<html lang="en">
<head>
<!-- Cabecera (head): metadatos, título y enlaces a CSS, JS o fuentes -->

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enlaces o hipervinculos</title>
</head>
<body>
    <!-- Aquí comienza el contenido visible de la página. -->
<!-- Cuerpo (body): contenido visible en la ventana del navegador -->

    <!-- 
        NAVEGACIÓN INTERNA/ESTÁNDAR:
        Se utiliza la etiqueta <a> (Anchor). El atributo 'href' es obligatorio.
    -->
    <!-- Párrafo de texto. -->
    <p>Enalce en una misma pestaña</p>
    <a href="https://www.youtube.com">Youtube</a>

    <!-- 
        NAVEGACIÓN EXTERNA:
        target="_blank": Abre el enlace en una nueva pestaña.
        SEGURIDAD: Se añade rel="noopener noreferrer" para evitar ataques de acceso al objeto 'window.opener' 
        de la página de origen y mejorar el rendimiento.
    -->
    <!-- Párrafo de texto. -->
    <p>Enlace que se abre en una nueva pestaña</p>
    <a href="https://www.google.com" target="_blank" rel="noopener noreferrer">Google</a>
</body>
<!-- Cierre del documento HTML -->
</html>
