<body>
    <main class="container">
        <!-- 
            Este título demuestra la especificidad. 
            Aunque tiene un estilo en línea (color: blanchedalmond), 
            el color final será 'brown' debido al !important en el CSS. 
        -->
        <h1 id="titulo" class="titulo" style="color: blanchedalmond;">Prueba de Especificidad</h1>
        
        <p>En esta lección analizamos cómo el navegador decide qué color aplicar cuando hay conflictos entre un <code>ID</code>, una <code>Clase</code> y el uso de <code>!important</code>.</p>
    </main>
