<!DOCTYPE html>
<!-- CURSO_WEB_DOC_HTML v1
     Archivo: HTML y CSS/Responsive Design/Picture,Source,Media/picture.html
     Título: Picture, Source y Media
     Propósito: estructura semántica y contenido; el navegador interpreta estas etiquetas para mostrar la página.
     Relación: clases e IDs enlazan con archivos .css y .js de esta misma carpeta o rutas indicadas.
-->
<!-- CURSO_WEB_HTML_STRUCT v1 -->


<html lang="en">
<head>
<!-- Cabecera (head): metadatos, título y enlaces a CSS, JS o fuentes -->

    <meta charset="UTF-8">
    <link rel="stylesheet" href="pic.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Picture, Source y Media</title>
</head>
<body>
<!-- Cuerpo (body): contenido visible en la ventana del navegador -->

    <picture>
        <source type="image/webp" srcset="fredy.webp">
        <source media="(max-width: 400px)" srcset="fredy-small.jpg">
        <source media="(max-width: 600px)" srcset="fredy-medium.jpg">
        <img src="fredy.jpg" alt="">
    </picture>
</body>
<!-- Cierre del documento HTML -->
</html>
