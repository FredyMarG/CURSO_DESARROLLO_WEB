<!DOCTYPE html>
<!-- CURSO_WEB_DOC_HTML v1
     Archivo: HTML y CSS/HTML Avanzado/Lazy load/lazy.html
     Título: Lazy load
     Propósito: estructura semántica y contenido; el navegador interpreta estas etiquetas para mostrar la página.
     Relación: clases e IDs enlazan con archivos .css y .js de esta misma carpeta o rutas indicadas.
-->
<!-- CURSO_WEB_HTML_STRUCT v1 -->


<html lang="en">
<head>
<!-- Cabecera (head): metadatos, título y enlaces a CSS, JS o fuentes -->

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="lazy.css">
    <title>Lazy load</title>
</head>
<body>
    <!-- Aquí comienza el contenido visible de la página. -->
<!-- Cuerpo (body): contenido visible en la ventana del navegador -->

    <!-- 
        Uso de etiquetas de bloque: <p> define párrafos de texto. 
        Para un mejor SEO y accesibilidad, el contenido principal debería estar dentro de una etiqueta <main>.
    -->
    <!-- Párrafo de texto. -->
    <p>
        Lorem ipsum dolor sit amet, consectetur adipisicing elit. Numquam ratione, officia ducimus accusamus recusandae dolores illo dolore nam reiciendis ipsum quidem cumque, repudiandae quibusdam vitae, pariatur vel minima dolor magni!
    </p>
    
    <!-- 
        PERFORMANCE: Atributo 'loading="lazy"'. 
        - 'lazy': Indica al navegador que posponga la carga de la imagen hasta que esté cerca del viewport (el área visible).
        - Ventaja: Ahorra ancho de banda, mejora el tiempo de carga inicial (LCP) y la experiencia de usuario en móviles.
        - 'eager' (por defecto): Carga la imagen de inmediato, ideal para imágenes 'Above the Fold' (cabeceras).
    -->
    
    <!-- 
        ACCESIBILIDAD (A11y) y SEO: 
        Falta el atributo 'alt'. Siempre debe incluirse para describir la imagen a lectores de pantalla 
        y para cuando la imagen no carga.
    -->
    <img src="img/img1.jpg" loading="lazy" alt="Descripción descriptiva de la imagen para SEO y accesibilidad">
</body>
<!-- Cierre del documento HTML -->
</html>
