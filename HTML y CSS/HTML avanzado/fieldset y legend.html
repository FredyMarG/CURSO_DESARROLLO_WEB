<!DOCTYPE html>
<!-- CURSO_WEB_DOC_HTML v1
     Archivo: HTML y CSS/HTML Avanzado/Fieldset y legend.html
     Título: Fielset y legend
     Propósito: estructura semántica y contenido; el navegador interpreta estas etiquetas para mostrar la página.
     Relación: clases e IDs enlazan con archivos .css y .js de esta misma carpeta o rutas indicadas.
-->
<!-- CURSO_WEB_HTML_STRUCT v1 -->


<html lang="en">
<head>
<!-- Cabecera (head): metadatos, título y enlaces a CSS, JS o fuentes -->

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/fieldset-legend.css">
    <title>Fielset y legend</title>
</head>
<body>
<!-- Cuerpo (body): contenido visible en la ventana del navegador -->

    <form action="">
<!-- Formulario de envío de datos (form) -->

        <fieldset> <!-- fieldset: Crea una caja que agrupa visual y semánticamente elementos del form -->
            <legend>Información basica</legend>
            <!-- legend: Proporciona un título o contexto para el fieldset padre -->
            <input type="text" placeholder="Nombre">
            <input type="text" placeholder="Apellido">
            <input type="number" placeholder="Edad">
        </fieldset>
        
        <fieldset>
            <legend>Información de contacto</legend>
            <input type="email" placeholder="Correo electrónico">
            <input type="number" placeholder="Telefono">
        </fieldset>
    </form>
</body>
<!-- Cierre del documento HTML -->
</html>
