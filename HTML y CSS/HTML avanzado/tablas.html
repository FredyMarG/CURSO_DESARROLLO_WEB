<!DOCTYPE html>
<!-- CURSO_WEB_DOC_HTML v1
     Archivo: HTML y CSS/HTML Avanzado/Tablas.html
     Título: Tablas
     Propósito: estructura semántica y contenido; el navegador interpreta estas etiquetas para mostrar la página.
     Relación: clases e IDs enlazan con archivos .css y .js de esta misma carpeta o rutas indicadas.
-->
<!-- CURSO_WEB_HTML_STRUCT v1 -->

<!-- Definición del idioma para accesibilidad y motores de búsqueda. -->
<html lang="es">
<head>
<!-- Cabecera (head): Contiene metadatos e instrucciones para el navegador -->

    <meta charset="UTF-8"> <!-- Codificación universal para soportar acentos y caracteres especiales. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Control del escalado en dispositivos móviles. -->
    <link rel="stylesheet" href="css/tabla.css"> <!-- Vinculación con la hoja de estilos externa. -->
    <title>Lección: Estructura de Tablas Semánticas</title>
</head>
<body>
    <!-- Aquí comienza el contenido visible de la página. -->
<!-- Cuerpo (body): contenido visible en la ventana del navegador -->

    <!-- 
        ETIQUETA <table>: Define el inicio del modelo de datos tabular. 
        Se recomienda el uso de thead, tbody y tfoot para mejorar la accesibilidad (lectores de pantalla) 
        y facilitar estilos CSS avanzados (como encabezados fijos).
    -->
    <table>
        <thead> <!-- thead: Define el conjunto de filas que actúan como cabecera de las columnas. -->
            <tr>
                <!-- <th>: Celda de encabezado. Proporciona contexto semántico a los datos de la columna. -->
                <th>Producto</th>
                <th>Costo</th>
                <th>Unidades</th>
            </tr>
        </thead>
        <tbody> <!-- tbody: Encapsula el cuerpo principal de la tabla donde residen los datos. -->
            <tr>
                <!-- <td>: Celda de datos estándar. Representa una unidad de información dentro de la fila. -->
                <td>Banano</td> 
                <td>$3</td>
                <td>3</td>
            </tr>
            <tr>
                <td>Manzana</td>
                <td>$2</td>
                <td>5</td>
            </tr>
            <tr>
                <td>Melon</td>
                <td>$5</td>
                <td>2</td>
            </tr>
        </tbody>
            
        <tfoot> <!-- tfoot: Define la fila de resumen o conclusiones (ej. totales), suele ir al final. -->
            <tr>
                <!-- .ht: Clase definida en tabla.css para dar jerarquía visual al pie. -->
                <th class="ht">Total</th>
                <!-- 
                    'colspan="2"': Atributo de expansión. Indica que esta celda 
                    debe ocupar el espacio horizontal de dos columnas del grid de la tabla. 
                -->
                <td class="ht" colspan="2">$10</td>
            </tr>
        </tfoot>
    </table>
</body>
<!-- Cierre del documento HTML -->
</html>
