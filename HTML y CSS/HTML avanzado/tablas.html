<!DOCTYPE html>
<!-- CURSO_WEB_DOC_HTML v1
     Archivo: HTML y CSS/HTML Avanzado/Tablas.html
     Título: Tablas
     Propósito: estructura semántica y contenido; el navegador interpreta estas etiquetas para mostrar la página.
     Relación: clases e IDs enlazan con archivos .css y .js de esta misma carpeta o rutas indicadas.
-->
<!-- CURSO_WEB_HTML_STRUCT v1 -->


<html lang="en">
<head>
<!-- Cabecera (head): metadatos, título y enlaces a CSS, JS o fuentes -->

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/tabla.css">
    <title>Tablas</title>
</head>
<body>
<!-- Cuerpo (body): contenido visible en la ventana del navegador -->

    <table>
        <thead> <!-- Encabezado semántico de la tabla -->
            <tr>
                <th>Produto</th>
                <th>Costo</th>
                <th>Unidades</th>
            </tr>
        </thead>
        <tbody> <!-- Cuerpo de la tabla: Contenedor de los datos principales -->
            <!-- <tr> define una fila; <td> define una celda de datos -->
            <tr>
                <td>Banano</td>
                <td>$3</td>
                <td>3</td>
            </tr>
            <tr>
                <td>Manzana</td>
                <td>$2</td>
                <td>5</td>
            </tr>
            <tr>
                <td>Melon</td>
                <td>$5</td>
                <td>2</td>
            </tr>
        </tbody>
            
        <tfoot> <!-- Pie de tabla: Generalmente usado para totales o resúmenes -->
            <tr>
                <th class="ht">Total</th>
                <!-- 'colspan="2"': Expande la celda para ocupar el espacio de dos columnas -->
                <td class="ht" colspan="2">$10</td>
            </tr>
        </tfoot>
    </table>
</body>
<!-- Cierre del documento HTML -->
</html>
