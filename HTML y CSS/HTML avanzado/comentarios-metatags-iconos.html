<!DOCTYPE html>
<!-- CURSO_WEB_DOC_HTML v1
     Archivo: HTML y CSS/HTML Avanzado/Comentarios-metatags-iconos.html
     Título: Iconos, metadatos y comentarios
     Propósito: estructura semántica y contenido; el navegador interpreta estas etiquetas para mostrar la página.
     Relación: clases e IDs enlazan con archivos .css y .js de esta misma carpeta o rutas indicadas.
-->
<!-- CURSO_WEB_HTML_STRUCT v1 -->


<html lang="en">
<head>
<!-- Cabecera (head): metadatos, título y enlaces a CSS, JS o fuentes -->
    
    <!-- UTF-8: Garantiza que el navegador interprete correctamente caracteres especiales como tildes y eñes. -->
    <meta charset="UTF-8">
    <!-- Viewport: Vital para el diseño Responsivo. Evita que los móviles escalen la página de forma incorrecta. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- SEO Meta Tags: La descripción es el texto que suele aparecer en los resultados de búsqueda de Google. -->
    <meta name="description" content="Guía completa sobre el uso de iconos, metadatos y comentarios en HTML5 para mejores prácticas.">
    <meta name="keywords" content="HTML, CSS, iconos, metadatos, comentarios">
    <meta name="author" content="Fredy">
    
    <!-- Directiva para robots: Evita que se guarde una copia en caché del sitio -->
    <meta name="robots" content="noarchive">
    <meta name="title" content="Iconos, metadatos y comentarios en HTML">
    
    <!-- FAVICON: Icono que aparece en la pestaña del navegador -->
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    
    <!-- El título es el factor SEO on-page más importante y lo que aparece en la pestaña del navegador. -->
    <title>Iconos, metadatos y comentarios</title>
</head>
<body>
    <!-- Aquí comienza el contenido visible de la página. -->
<!-- Cuerpo (body): contenido visible en la ventana del navegador -->
    
    <!-- El contenido principal debe ir siempre dentro de etiquetas semánticas (main, section, article). -->
    <!-- Bloque principal con el contenido más importante. -->
    <main>
        <h1>hola</h1>
    </main>
</body>
<!-- Cierre del documento HTML -->
</html>
