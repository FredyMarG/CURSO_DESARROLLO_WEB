<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Codificación de caracteres para soporte universal de símbolos y tildes -->
    <meta charset="UTF-8">
    <!-- Configuración del viewport para asegurar el comportamiento responsive en móviles -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- METADATOS SEO: Descripción y palabras clave para motores de búsqueda -->
    <meta name="description" content="Esta es una página de ejemplo que incluye iconos, metadatos y comentarios en HTML.">
    <meta name="keywords" content="HTML, CSS, iconos, metadatos, comentarios">
    <meta name="author" content="Fredy">
    
    <!-- Directiva para robots: Evita que se guarde una copia en caché del sitio -->
    <meta name="robots" content="noarchive">
    <meta name="title" content="Iconos, metadatos y comentarios en HTML">
    
    <!-- FAVICON: Icono que aparece en la pestaña del navegador -->
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    
    <title>Iconos, metadatos y comentarios</title>
</head>
<body>
    <!-- Comentario de bloque: No se renderiza en el navegador, solo visible en el código fuente -->
    <h1>hola</h1>
</body>
</html>
