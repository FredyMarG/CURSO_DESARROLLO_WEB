<!DOCTYPE html>
<!-- CURSO_WEB_DOC_HTML v1
     Archivo: HTML y CSS/HTML Avanzado/Details y summary.html
     Título: Details y Summary
     Propósito: estructura semántica y contenido; el navegador interpreta estas etiquetas para mostrar la página.
     Relación: clases e IDs enlazan con archivos .css y .js de esta misma carpeta o rutas indicadas.
-->
<!-- CURSO_WEB_HTML_STRUCT v1 -->


<html lang="en">
<head>
<!-- Cabecera (head): metadatos, título y enlaces a CSS, JS o fuentes -->

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/detailsysummary.css">
    <title>Details y Summary</title>
</head>
<body>
    <!-- Aquí comienza el contenido visible de la página. -->
<!-- Cuerpo (body): contenido visible en la ventana del navegador -->

    <!-- 
        <details>: Crea un widget de revelación interactivo que el usuario puede abrir y cerrar.
        Atributo opcional: 'open'. Si se añade, el contenido será visible por defecto.
    -->
    <details>
        <!-- 
            <summary>: Define el encabezado visible del widget <details>. 
            Al hacer clic en él, se alterna la visibilidad del contenido restante.
        -->
        <summary>¿Que tengo que traer?</summary>
    <!-- Lista de elementos relacionados. -->
        <ul>
        <!-- Elemento individual dentro de la lista. -->
            <li>Ropa cómoda</li>
        <!-- Elemento individual dentro de la lista. -->
            <li>Protector solar</li>
        <!-- Elemento individual dentro de la lista. -->
            <li>Gafas de sol</li>
        <!-- Elemento individual dentro de la lista. -->
            <li>Agua</li>
        </ul>
        
    </details>

    <!-- Ejemplo adicional de details para preguntas frecuentes (FAQ) -->
    <details>
        <summary>¿Debo ser mayor de edad</summary>
    <!-- Párrafo de texto. -->
        <p>Sí, debes ser mayor de edad o de lo contrario, estar acompañado de un adulto responsable.</p>
    </details>
</body>
<!-- Cierre del documento HTML -->
</html>
