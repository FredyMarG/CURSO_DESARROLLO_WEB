<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/detailsysummary.css">
    <title>Details y Summary</title>
</head>
<body>
    <!-- <details>: Widget de revelación interactivo. Oculta contenido hasta que el usuario lo despliega -->
    <details>
        <summary>¿Que tengo que traer?</summary>
        <!-- <summary>: El encabezado visible y clickable que controla el estado de <details> -->
        <ul>
            <li>Ropa cómoda</li>
            <li>Protector solar</li>
            <li>Gafas de sol</li>
            <li>Agua</li>
        </ul>
        
    </details>

    <details>
        <summary>¿Debo ser mayor de edad</summary>
        <p>Sí, debes ser mayor de edad o de lo contrario, estar acompañado de un adulto responsable.</p>
    </details>
</body>
</html>
